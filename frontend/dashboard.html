<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard - CivicConnect</title>

    <link rel="stylesheet" href="dashboard.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<!-- ===== NAVBAR ===== -->
<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">
            <div class="brand-logo-mark">
                <img src="logo.png">
            </div>
            CivicConnect
        </a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="landingpage.html">Home</a>
            <a class="nav-link" href="ngo-profile.html">My Profile</a>
            <a class="nav-link" href="#" onclick="logout()">Logout</a>
        </div>
    </div>
</nav>

<!-- ===== CREATE FORM ===== -->
<div class="dashboard-content">
    <h2 class="section-title">Create a New Volunteering Opportunity</h2>

    <form id="opportunityForm">
        <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text" class="form-control" id="title" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" id="description" required></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Start Date</label>
            <input type="date" class="form-control" id="start_date" required>
        </div>

        <div class="mb-3">
            <label class="form-label">End Date</label>
            <input type="date" class="form-control" id="end_date" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Location</label>
            <input type="text" class="form-control" id="location" required>
        </div>

        <button type="button" class="btn btn-info" onclick="showPreview()">Preview</button>
        <button type="button" class="btn btn-primary" onclick="submitOpportunity()">Submit</button>
    </form>
</div>

<!-- ===== EVENTS ===== -->
<div class="dashboard-content">
    <h2 class="section-title">Upcoming Volunteer Events</h2>
    <ul class="list-group" id="opportunitiesList"></ul>
</div>

<div class="text-center">
    <button class="btn btn-secondary mt-3" onclick="viewApplicants()">View Applicants</button>
</div>

<!-- ===== FOOTER ===== -->
<footer class="footer">
    © 2025 CivicConnect. All rights reserved.
</footer>

<script src="dashboard.js"></script>

</body>
</html>
