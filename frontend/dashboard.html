<!-- ===== CREATE FORM ===== -->
<div class="dashboard-content">
    <h2 class="section-title">Create a New Volunteering Opportunity</h2>
    <div id="approvalNotice" class="alert alert-warning d-none" role="alert"></div>

    <form id="opportunityForm">
        <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text" class="form-control" id="title" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Field</label>
            <select class="form-control" id="field" required>
                <option value="">Select Field</option>
                <option value="Education">Education</option>
                <option value="Health">Health</option>
                <option value="Environment">Environment</option>
                <option value="Community">Community</option>
                <option value="Elderly Care">Elderly Care</option>
                <option value="Children & Youth">Children & Youth</option>
                <option value="Disability Support">Disability Support</option>
                <option value="Food Distribution">Food Distribution</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" id="description" required></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Start Date</label>
            <input type="date" class="form-control" id="start_date" required>
        </div>

        <div class="mb-3">
            <label class="form-label">End Date</label>
            <input type="date" class="form-control" id="end_date" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Volunteering Days</label>
            <div class="day-picker" id="scheduleDays">
                <label><input type="checkbox" value="MON"> <span>MON</span></label>
                <label><input type="checkbox" value="TUE"> <span>TUE</span></label>
                <label><input type="checkbox" value="WED"> <span>WED</span></label>
                <label><input type="checkbox" value="THU"> <span>THU</span></label>
                <label><input type="checkbox" value="FRI"> <span>FRI</span></label>
                <label><input type="checkbox" value="SAT"> <span>SAT</span></label>
                <label><input type="checkbox" value="SUN"> <span>SUN</span></label>
            </div>
        </div>

        <div class="schedule-grid mb-3">
            <div>
                <label class="form-label">Start Time</label>
                <input type="time" class="form-control" id="start_time" required>
            </div>
            <div>
                <label class="form-label">End Time</label>
                <input type="time" class="form-control" id="end_time" required>
            </div>
        </div>

        <div class="schedule-summary mb-3">
            <div>
                <span class="summary-label">Calculated Volunteer Hours</span>
                <strong id="hoursPreview">Choose dates, days, and timing</strong>
            </div>
            <input type="hidden" id="hours_required" value="">
        </div>

        <div class="mb-3">
            <label class="form-label">Number of Volunteers Needed</label>
            <input type="number" class="form-control" id="capacity" min="1" step="1" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Location</label>
            <input type="text" class="form-control" id="location" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Application Questions</label>
            <textarea class="form-control" id="application_questions" rows="3"
                placeholder="Optional: one question per line, up to 5 questions"></textarea>
        </div>

        <button type="button" id="previewBtn" class="btn btn-info" onclick="showPreview()">Preview</button>
        <button type="button" id="submitBtn" class="btn btn-primary" onclick="submitOpportunity()">Submit</button>
        <button type="button" id="cancelEditBtn" class="btn btn-secondary d-none" onclick="cancelEditOpportunity()">Cancel Edit</button>
    </form>
</div>

<!-- ===== EVENTS ===== -->
