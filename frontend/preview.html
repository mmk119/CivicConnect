<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Preview Opportunity - CivicConnect</title>
    <script src="notifications.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;

            background:
                linear-gradient(rgba(10,25,50,0.85), rgba(10,25,50,0.95)),
                url('handinhand.jpeg') no-repeat center center fixed;

            background-size: cover;

            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .preview-card {
            max-width: 550px;
            width: 100%;
            padding: 30px;
            border-radius: 20px;

            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(12px);

            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);

            color: white;
            text-align: center;
        }

        h2 {
            color: white;
            margin-bottom: 15px;
        }

        h4 {
            color: #4dabf7;
            margin-bottom: 10px;
        }

        p {
            color: rgba(255,255,255,0.85);
        }

        strong {
            color: white;
        }

        hr {
            border-color: rgba(255,255,255,0.2);
        }

        .btn-edit {
            background: linear-gradient(135deg, #ff7a18, #0d6efd);
            border: none;
            border-radius: 10px;
            padding: 10px 18px;
            color: white;
            margin-top: 10px;
        }

        .btn-edit:hover {
            transform: scale(1.05);
        }

        .btn-submit {
            background: linear-gradient(135deg, #0fb9b1, #3ddbd9);
            border: none;
            border-radius: 10px;
            padding: 10px 18px;
            color: white;
            margin-top: 10px;
            margin-left: 10px;
        }

        .btn-submit:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <div class="preview-card">

        <h2>Preview Opportunity</h2>
        <hr>

        <h4 id="previewTitle"></h4>
        <p><strong>Field:</strong> <span id="previewField"></span></p>
        <p id="previewDescription"></p>

        <p><strong>Start Date:</strong> <span id="previewStartDate"></span></p>
        <p><strong>End Date:</strong> <span id="previewEndDate"></span></p>
        <p><strong>Hours Required:</strong> <span id="previewHours"></span></p>
        <p><strong>Volunteers Needed:</strong> <span id="previewCapacity"></span></p>
        <p><strong>Location:</strong> <span id="previewLocation"></span></p>

        <div>
            <button class="btn btn-edit" onclick="goBack()">Edit</button>
            <button class="btn btn-submit" onclick="submitOpportunity()">Submit</button>
        </div>

    </div>

    <script>
        function getTokenPayload() {
            const token = localStorage.getItem("token");
            if (!token) return null;

            try {
                return JSON.parse(atob(token.split(".")[1]));
            } catch (error) {
                return null;
            }
        }

        function requireNgoAccess() {
            const payload = getTokenPayload();

            if (!payload || payload.role !== "NGO" || !payload.ngo_id) {
                alert("Only NGO accounts can create volunteering opportunities.");
                window.location.href = "opportunities.html";
                return false;
            }

            return true;
        }

        document.addEventListener("DOMContentLoaded", function () {
            if (!requireNgoAccess()) return;

            const storedData = localStorage.getItem("opportunityPreview");

            if (!storedData) {
                alert("No opportunity details found.");
                window.location.href = "dashboard.html";
                return;
            }

            const opportunity = JSON.parse(storedData);

            document.getElementById("previewTitle").innerText = opportunity.title || "";
            document.getElementById("previewField").innerText = opportunity.field || "";
            document.getElementById("previewDescription").innerText = opportunity.description || "";
            document.getElementById("previewStartDate").innerText = opportunity.start_date || "";
            document.getElementById("previewEndDate").innerText = opportunity.end_date || "";
            document.getElementById("previewHours").innerText = opportunity.hours_required ? `${opportunity.hours_required} hours` : "";
            document.getElementById("previewCapacity").innerText = opportunity.capacity ? `${opportunity.capacity} volunteers` : "";
            document.getElementById("previewLocation").innerText = opportunity.location || "";
        });

        function goBack() {
            window.location.href = "dashboard.html?fromPreview=1";
        }

        function submitOpportunity() {
            if (!requireNgoAccess()) return;

            const storedData = localStorage.getItem("opportunityPreview");

            if (!storedData) {
                alert("No opportunity data found.");
                return;
            }

            const opportunity = JSON.parse(storedData);

            fetch('/api/opportunities/ins', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${localStorage.getItem("token")}`
                },
                body: JSON.stringify(opportunity)
            })
            .then(res => res.json().then(data => ({ ok: res.ok, data })))
            .then(({ ok, data }) => {
                if (!ok) {
                    alert(data.error || "Failed to submit opportunity.");
                    return;
                }

                alert(data.message || "Opportunity submitted successfully!");
                localStorage.removeItem("opportunityPreview");
                window.location.href = "dashboard.html";
            })
            .catch(err => {
                console.error(err);
                alert("Failed to submit opportunity.");
            });
        }
    </script>

</body>
</html>
