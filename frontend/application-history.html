<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Application History - CivicConnect</title>
    <script src="notifications.js"></script>
    <script src="app-utils.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #f7fbff;
      background:
        radial-gradient(circle at 18% 12%, rgba(67, 214, 216, 0.15), transparent 28%),
        linear-gradient(135deg, #071a33 0%, #102b50 45%, #0d203c 100%);
    }

    .navbar {
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 48px;
      background: linear-gradient(90deg, #1087ee 0%, #ff6800 100%);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
      color: #fff;
      text-decoration: none;
      font-size: 2rem;
      font-weight: 800;
    }

    .brand img {
      width: 66px;
      height: 66px;
      border-radius: 12px;
      background: #fff;
      object-fit: contain;
      padding: 5px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .nav-links a,
    .nav-links button {
      color: #fff;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 700;
      background: transparent;
      border: none;
      cursor: pointer;
    }

    .nav-links button {
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 10px;
      padding: 12px 18px;
    }

    .page {
      width: min(1440px, calc(100% - 64px));
      margin: 38px auto 64px;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 420px);
      align-items: end;
      gap: 28px;
      margin-bottom: 18px;
      padding: 28px;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.07);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.18);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      color: #43d6d8;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.78rem;
    }

    h1 {
      font-size: clamp(2rem, 4vw, 3.1rem);
      line-height: 1.05;
      margin-bottom: 10px;
    }

    .hero p {
      color: #cfd9e6;
      font-size: 1.05rem;
      max-width: 760px;
      line-height: 1.6;
    }

    .summary-card {
      min-width: 0;
      padding: 20px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.1);
      text-align: center;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(180px, 1fr));
      gap: 14px;
    }

    .summary-number {
      display: block;
      font-size: 2rem;
      font-weight: 900;
      color: #43d6d8;
    }

    .summary-label {
      color: #cfd9e6;
      font-weight: 700;
    }

    .status-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 22px 0;
    }

    .schedule-actions {
      display: flex;
      justify-content: flex-end;
      margin: -58px 0 24px;
    }

    .filter-btn {
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      padding: 10px 16px;
      color: #dce8f7;
      background: rgba(255, 255, 255, 0.08);
      font-weight: 800;
      cursor: pointer;
    }

    .filter-btn.active {
      background: #1285f3;
      border-color: #1285f3;
      color: #fff;
      box-shadow: 0 10px 24px rgba(18, 133, 243, 0.24);
    }

    .history-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 18px;
      align-items: start;
    }

    .history-card {
      position: relative;
      overflow: hidden;
      min-height: 0;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      background: #f8fbff;
      color: #10253d;
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.2);
    }

    .history-card::before {
      content: "";
      height: 4px;
      background: linear-gradient(90deg, #1285f3, #43d6d8);
    }

    .card-body {
      flex: 1;
      padding: 18px;
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: nowrap;
    }

    .card-top-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .field-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 8px;
      border-radius: 7px;
      background: #e7f4ff;
      color: #0877da;
      font-size: 0.74rem;
      font-weight: 800;
      max-width: 68%;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 9px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 900;
      text-transform: capitalize;
    }

    .status-pending {
      background: #fff3cd;
      color: #946200;
    }

    .status-accepted {
      background: #d9f5df;
      color: #137b2c;
    }

    .status-rejected {
      background: #ffe0e0;
      color: #b42323;
    }

    .status-completed {
      background: #d9f5df;
      color: #137b2c;
    }

    .status-no-show {
      background: #fce8e8;
      color: #8b1a1a;
    }

    .status-withdrawn {
      background: #f0f0f0;
      color: #555;
    }

    .progress-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(82px, 1fr));
      gap: 6px;
      margin: 14px 0;
    }

    .progress-step {
      min-height: 38px;
      padding: 7px 6px;
      border: 1px solid #dce7f1;
      border-radius: 10px;
      background: #fff;
      color: #607388;
      font-size: 0.72rem;
      font-weight: 800;
      line-height: 1.25;
    }

    .progress-step i {
      display: block;
      margin-bottom: 3px;
      color: #94a6b8;
    }

    .progress-step.done {
      border-color: #bcebc9;
      background: #ecfbf1;
      color: #11642a;
    }

    .progress-step.done i {
      color: #168a3a;
    }

    .progress-step.current {
      border-color: #b9dcff;
      background: #eef7ff;
      color: #0877da;
    }

    .progress-step.blocked {
      border-color: #ffe0a3;
      background: #fff8e6;
      color: #805100;
    }

    .history-card h2 {
      font-size: 1.12rem;
      line-height: 1.18;
      margin-bottom: 8px;
      color: #08233c;
    }

    .card-subtitle {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 10px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 0;
      border-radius: 999px;
      background: transparent;
      color: #31506d;
      font-size: 0.8rem;
      font-weight: 800;
    }

    .pill + .pill::before {
      content: "";
      width: 4px;
      height: 4px;
      margin-right: 1px;
      border-radius: 50%;
      background: #9db0c2;
    }

    .description {
      min-height: 0;
      color: #486179;
      line-height: 1.45;
      margin-bottom: 12px;
      font-size: 0.88rem;
    }

    .meta-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      color: #486179;
      font-weight: 600;
      font-size: 0.84rem;
    }

    .meta-heading {
      margin: 14px 0 8px;
      color: #183854;
      font-size: 0.92rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .meta-list span {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      min-height: 34px;
      padding: 8px 9px;
      border: 1px solid #e2ebf3;
      border-radius: 10px;
      background: #fff;
      line-height: 1.35;
    }

    .meta-list i {
      flex: 0 0 18px;
      width: 18px;
      color: #1285f3;
      margin: 2px 0 0;
    }

    .schedule-panel {
      margin-top: 12px;
    }

    .card-extra {
      display: none;
      margin-top: 12px;
    }

    .history-card.expanded .card-extra {
      display: block;
    }

    .summary-line {
      display: grid;
      gap: 8px;
      margin: 12px 0 2px;
      color: #385672;
      font-size: 0.88rem;
      font-weight: 800;
    }

    .summary-line span {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .summary-line i {
      width: 16px;
      color: #1285f3;
    }

    .schedule-panel h3 {
      margin-bottom: 8px;
      color: #0c3359;
      font-size: 0.82rem;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .schedule-grid-card {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
    }

    .schedule-item {
      display: flex;
      gap: 8px;
      min-height: 46px;
      padding: 9px 10px;
      border: 1px solid #dce7f1;
      border-radius: 9px;
      background: #fff;
      color: #385672;
      font-weight: 800;
      line-height: 1.35;
      font-size: 0.82rem;
    }

    .schedule-item i {
      flex: 0 0 16px;
      margin-top: 1px;
      color: #1285f3;
      font-size: 0.92rem;
    }

    .schedule-item small {
      display: block;
      margin-bottom: 2px;
      color: #7a8ea2;
      font-size: 0.65rem;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .card-actions {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      padding: 14px 20px;
      background: #eef4f9;
    }

    .details-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 0;
      min-height: 44px;
      padding: 8px 10px;
      border: 1px solid #cdd8e3;
      border-radius: 10px;
      color: #08233c;
      text-decoration: none;
      font-weight: 800;
      font-size: 0.9rem;
      background: #fff;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toggle-details {
      border-color: #b9d5ef;
      background: #eef7ff;
      color: #0c5ea8;
    }

    .more-actions {
      position: relative;
    }

    .menu-button {
      width: 46px;
      padding: 0;
    }

    .action-menu {
      position: absolute;
      right: 0;
      bottom: calc(100% + 8px);
      z-index: 10;
      display: none;
      min-width: 210px;
      padding: 8px;
      border: 1px solid #cdd8e3;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 18px 38px rgba(16, 37, 61, 0.2);
    }

    .action-menu.open {
      display: grid;
      gap: 6px;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 40px;
      padding: 9px 10px;
      border-radius: 9px;
      color: #10253d;
      text-decoration: none;
      font-weight: 800;
      background: transparent;
      border: 0;
      cursor: pointer;
      text-align: left;
    }

    .menu-item:hover {
      background: #eef7ff;
    }

    .details-link:hover,
    .feedback-button:hover,
    .filter-btn:hover {
      transform: translateY(-1px);
    }

    .feedback-panel {
      margin: 0 20px 20px;
      padding: 16px;
      border-top: 1px solid #e1e8ef;
      border: 1px solid #dce7f1;
      border-radius: 14px;
      background: #fff;
    }

    .feedback-panel h3 {
      margin-bottom: 10px;
      color: #08233c;
      font-size: 1rem;
    }

    .feedback-grid {
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }

    .feedback-panel select,
    .feedback-panel textarea,
    .feedback-panel input {
      width: 100%;
      min-height: 42px;
      padding: 10px 12px;
      border: 1px solid #cdd8e3;
      border-radius: 10px;
      font: inherit;
    }

    .feedback-panel textarea {
      min-height: 82px;
      resize: vertical;
    }

    .feedback-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 42px;
      padding: 10px 14px;
      border: none;
      border-radius: 10px;
      color: #fff;
      background: #1285f3;
      font-weight: 800;
      cursor: pointer;
    }

    .received-feedback {
      margin-top: 12px;
      padding: 14px;
      border-radius: 12px;
      color: #12304c;
      background: #eef8f8;
      border: 1px solid #c9eeee;
    }

    .certificate-status {
      margin: 0 20px 16px;
      padding: 14px;
      border-radius: 12px;
      background: #f8fafc;
      border: 1px solid #d9e4ef;
      color: #405a73;
      font-weight: 700;
    }

    .certificate-status.ready {
      background: #ecfbf1;
      border-color: #bcebc9;
      color: #11642a;
    }

    .certificate-status.pending {
      background: #fff8e6;
      border-color: #ffe0a3;
      color: #805100;
    }

    .certificate-meta {
      display: grid;
      gap: 6px;
      margin-top: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .feedback-steps {
      display: grid;
      gap: 14px;
    }

    .step-label {
      display: block;
      margin-bottom: 7px;
      color: #27435e;
      font-size: 0.9rem;
      font-weight: 900;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .feedback-tag {
      border: 1px solid #c9d8e8;
      border-radius: 999px;
      padding: 8px 11px;
      background: #f8fbff;
      color: #25435f;
      font-weight: 800;
      cursor: pointer;
    }

    .feedback-tag.active {
      border-color: #1285f3;
      background: #e7f4ff;
      color: #0877da;
    }

    .char-counter {
      margin-top: 5px;
      text-align: right;
      color: #6b7f93;
      font-size: 0.74rem;
      font-weight: 700;
    }

    .certificate-modal {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(5, 18, 34, 0.7);
    }

    .certificate-modal.open {
      display: flex;
    }

    .certificate-dialog {
      width: min(620px, 100%);
      overflow: hidden;
      border-radius: 16px;
      background: #fff;
      color: #10253d;
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.34);
    }

    .certificate-preview {
      margin: 22px;
      padding: 28px;
      border: 6px solid #1285f3;
      text-align: center;
      font-family: Georgia, serif;
    }

    .certificate-preview h2 {
      margin: 8px 0 14px;
      font-size: 1.8rem;
    }

    .certificate-dialog-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 0 22px 22px;
    }

    .certificate-dialog-actions button {
      flex: 1;
      min-height: 42px;
      border: 1px solid #cdd8e3;
      border-radius: 10px;
      background: #fff;
      color: #10253d;
      font-weight: 900;
      cursor: pointer;
    }

    .certificate-dialog-actions .primary {
      border-color: #1285f3;
      background: #1285f3;
      color: #fff;
    }

    .rating-line {
      color: #ff8a00;
      font-weight: 900;
    }

    .empty-state,
    .error-state {
      padding: 52px 24px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.08);
      text-align: center;
      color: #dce8f7;
    }

    .empty-state i,
    .error-state i {
      display: block;
      margin-bottom: 16px;
      color: #43d6d8;
      font-size: 2.6rem;
    }

    .loading {
      padding: 46px;
      text-align: center;
      color: #dce8f7;
      font-size: 1.1rem;
      font-weight: 800;
    }

    @media (max-width: 760px) {
      .navbar {
        height: auto;
        align-items: flex-start;
        flex-direction: column;
        gap: 18px;
        padding: 18px 22px;
      }

      .brand {
        font-size: 1.55rem;
      }

      .nav-links {
        width: 100%;
        justify-content: space-between;
        gap: 12px;
      }

      .hero {
        align-items: stretch;
        flex-direction: column;
      }

      .hero {
        display: flex;
      }

      .summary-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .page {
        width: min(100% - 28px, 1180px);
        margin: 28px auto;
      }

      .card-actions {
        padding: 16px;
      }

      .history-grid {
        grid-template-columns: 1fr;
      }

      .meta-list,
      .progress-strip,
      .schedule-grid-card {
        grid-template-columns: 1fr;
      }

      .schedule-actions {
        justify-content: stretch;
        margin: 0 0 22px;
      }

      .schedule-actions .filter-btn {
        width: 100%;
      }

      .feedback-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 520px) {
      .summary-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <link rel="stylesheet" href="civic-ui.css">
</head>
<body>
  <nav class="navbar">
    <a class="brand" href="landingpage.html">
      <img src="logo.png" alt="CivicConnect Logo">
      CivicConnect
    </a>
    <div class="nav-links">
      <a href="landingpage.html">Home</a>
      <a href="opportunities.html">Opportunities</a>
      <a href="profile.html">My Profile</a>
      <button type="button" id="logout-btn">Log Out</button>
    </div>
  </nav>

  <main class="page">
    <section class="hero">
      <div>
        <span class="eyebrow"><i class="fas fa-clock-rotate-left"></i> Volunteer dashboard</span>
        <h1>Application History</h1>
        <p>Track the opportunities you applied to, their current status, the date you applied, and the NGO behind each opportunity.</p>
      </div>
      <div class="summary-grid" aria-label="Volunteer application summary">
        <div class="summary-card">
          <span class="summary-number" id="application-count">0</span>
          <span class="summary-label">Applications</span>
        </div>
        <div class="summary-card">
          <span class="summary-number" id="completed-hours-count">0</span>
          <span class="summary-label">Hours Completed</span>
        </div>
      </div>
    </section>

    <div class="status-filters" aria-label="Filter applications by status">
      <button type="button" class="filter-btn active" data-filter="all">All</button>
      <button type="button" class="filter-btn" data-filter="pending">Pending</button>
      <button type="button" class="filter-btn" data-filter="accepted">Accepted</button>
      <button type="button" class="filter-btn" data-filter="completed">Completed</button>
      <button type="button" class="filter-btn" data-filter="rejected">Rejected</button>
      <button type="button" class="filter-btn" data-filter="withdrawn">Withdrawn</button>
    </div>

    <div class="schedule-actions">
      <button type="button" class="filter-btn" id="download-schedule-btn">
        <i class="fas fa-calendar-arrow-down"></i> Download Accepted Schedule
      </button>
    </div>

    <section id="history-container" class="history-grid">
      <div class="loading">Loading your applications...</div>
    </section>
  </main>

  <div class="certificate-modal" id="certificate-modal" role="dialog" aria-modal="true" aria-labelledby="certificate-preview-title">
    <div class="certificate-dialog">
      <div class="certificate-preview" id="certificate-preview"></div>
      <div class="certificate-dialog-actions">
        <button type="button" onclick="closeCertificatePreview()">Close</button>
        <button type="button" onclick="copyCurrentCertificateLink()">Copy Verification Link</button>
        <button type="button" class="primary" onclick="openCurrentCertificate()">Print / Save PDF</button>
      </div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem("token");
    let applications = [];
    let activeFilter = "all";
    let currentCertificateApplicationId = null;
    let currentCertificateVerifyUrl = "";

    function clearAuthStorage() {
      localStorage.removeItem("token");
      localStorage.removeItem("user");
      localStorage.removeItem("role");
      localStorage.removeItem("userRole");
      localStorage.removeItem("loggedInUser");
    }

    function getTokenPayload() {
      if (!token) return null;
      try {
        return JSON.parse(atob(token.split(".")[1]));
      } catch (err) {
        return null;
      }
    }

    function requireVolunteer() {
      const payload = getTokenPayload();
      if (!payload || payload.role !== "Volunteer") {
        clearAuthStorage();
        window.location.href = "login.html";
        return false;
      }
      return true;
    }

    function formatDate(value) {
      if (!value) return "Not available";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "Not available";
      return date.toLocaleDateString("en-US", {
        year: "numeric",
        month: "short",
        day: "numeric"
      });
    }

    const weekdayOrder = ["MON", "TUE", "WED", "THU", "FRI", "SAT", "SUN"];

    function formatScheduleDays(days) {
      const selected = Array.isArray(days) ? days : String(days || "").split(",");
      return weekdayOrder.filter(day => selected.includes(day)).join(", ") || "Days TBD";
    }

    function formatTime(value) {
      return value ? String(value).slice(0, 5) : "Time TBD";
    }

    function formatHours(value) {
      const hours = Number(value) || 0;
      return Number.isInteger(hours) ? String(hours) : hours.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
    }

    function toMinutes(value) {
      const [hours, minutes] = String(value || "").slice(0, 5).split(":").map(Number);
      if (!Number.isFinite(hours) || !Number.isFinite(minutes)) return null;
      return hours * 60 + minutes;
    }

    function scheduleRows() {
      const rows = [];
      for (let hour = 7; hour <= 21; hour += 1) {
        const displayHour = hour === 12 ? 12 : hour > 12 ? hour - 12 : hour;
        const meridiem = hour >= 12 ? "PM" : "AM";
        const display = `${displayHour}:00 ${meridiem}`;
        rows.push({ hour, display });
      }
      return rows;
    }

    function buildScheduleHtml() {
      const accepted = applications.filter(app => app.status === "accepted");
      const days = [
        ["MON", "Monday"],
        ["TUE", "Tuesday"],
        ["WED", "Wednesday"],
        ["THU", "Thursday"],
        ["FRI", "Friday"],
        ["SAT", "Saturday"],
        ["SUN", "Sunday"]
      ];
      const rows = scheduleRows();
      const startDayMinutes = 7 * 60;
      const endDayMinutes = 22 * 60;
      const rowHeight = 52;
      const scheduleHeight = rows.length * rowHeight;
      const safeName = localStorage.getItem("userName") || "Volunteer";

      const events = accepted.flatMap(app => {
        const selectedDays = String(app.schedule_days || "").split(",").map(day => day.trim()).filter(Boolean);
        const start = toMinutes(app.start_time);
        const end = toMinutes(app.end_time);
        if (start === null || end === null || end <= start) return [];
        const clampedStart = Math.max(startDayMinutes, Math.min(start, endDayMinutes));
        const clampedEnd = Math.max(startDayMinutes, Math.min(end, endDayMinutes));
        if (clampedEnd <= clampedStart) return [];
        return selectedDays.map(day => ({
          day,
          top: ((clampedStart - startDayMinutes) / 60) * rowHeight,
          height: Math.max(42, ((clampedEnd - clampedStart) / 60) * rowHeight - 6),
          title: app.title,
          location: app.location || "Location TBD",
          ngo: app.ngo_name || "NGO",
          time: `${formatTime(app.start_time)} - ${formatTime(app.end_time)}`
        }));
      }).sort((a, b) => a.top - b.top || a.title.localeCompare(b.title));

      const escape = escapeHTML;
      return `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CivicConnect Accepted Schedule</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 22px; font-family: Arial, sans-serif; color: #26323f; background: #fff; }
    .header { display: flex; justify-content: space-between; gap: 20px; align-items: flex-end; margin-bottom: 16px; }
    h1 { margin: 0 0 6px; font-size: 26px; color: #10253d; }
    p { margin: 0; color: #61758a; font-size: 13px; }
    .schedule-wrap { width: 100%; overflow-x: auto; border: 1px solid #d7e1ec; border-radius: 10px; background: #fff; }
    .schedule { min-width: 980px; }
    .schedule-head, .schedule-body { display: grid; grid-template-columns: 70px repeat(7, minmax(120px, 1fr)); }
    .day { height: 38px; display: grid; place-items: center; border-left: 1px solid #d7e1ec; border-bottom: 1px solid #d7e1ec; font-size: 12px; font-weight: 800; color: #10253d; background: #f8fafc; }
    .day:first-child { border-left: 0; }
    .schedule-body { position: relative; min-height: ${scheduleHeight}px; }
    .times { position: relative; min-height: ${scheduleHeight}px; border-right: 1px solid #d7e1ec; background: #fff; }
    .time { position: absolute; left: 0; right: 0; height: ${rowHeight}px; padding: 8px 10px; border-bottom: 1px solid #d7e1ec; color: #506174; font-size: 11px; }
    .day-column { position: relative; min-height: ${scheduleHeight}px; border-right: 1px solid #d7e1ec; background-image: repeating-linear-gradient(to bottom, transparent 0, transparent ${rowHeight - 1}px, #d7e1ec ${rowHeight - 1}px, #d7e1ec ${rowHeight}px); }
    .event { position: absolute; left: 6px; right: 6px; padding: 7px 8px; border-radius: 7px; background: #e8f4ff; border-left: 4px solid #1285f3; box-shadow: 0 6px 12px rgba(16, 37, 61, .12); overflow: hidden; }
    .event strong { display: block; font-size: 12px; line-height: 1.2; color: #10253d; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .event span { display: block; font-size: 10px; color: #4f6378; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .empty { padding: 26px; border: 1px dashed #b9c8d8; border-radius: 12px; color: #61758a; }
    .print { border: 0; background: #1285f3; color: #fff; font-weight: 800; border-radius: 8px; padding: 10px 14px; cursor: pointer; }
    @media print {
      @page { size: landscape; margin: 10mm; }
      body { padding: 0; }
      .print { display: none; }
      .schedule-wrap { overflow: visible; border-radius: 0; }
      .schedule { min-width: 0; width: 100%; }
      .schedule-head, .schedule-body { grid-template-columns: 58px repeat(7, minmax(0, 1fr)); }
      h1 { font-size: 22px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>Accepted Volunteer Schedule</h1>
      <p>${escape(safeName)} | Generated ${new Date().toLocaleDateString()}</p>
    </div>
    <button class="print" onclick="window.print()">Print / Save PDF</button>
  </div>
  ${accepted.length === 0 ? `<div class="empty">No accepted opportunities yet.</div>` : `
  <div class="schedule-wrap">
    <div class="schedule">
      <div class="schedule-head">
        <div class="day"></div>
        ${days.map(([, label]) => `<div class="day">${label}</div>`).join("")}
      </div>
      <div class="schedule-body">
        <div class="times">
          ${rows.map((row, index) => `<div class="time" style="top:${index * rowHeight}px;">${row.display}</div>`).join("")}
        </div>
        ${days.map(([code]) => `
          <div class="day-column">
            ${events.filter(event => event.day === code).map(event => `
              <div class="event" style="top:${event.top}px;height:${event.height}px;">
                <strong>${escape(event.title)}</strong>
                <span>${escape(event.time)}</span>
                <span>${escape(event.location)}</span>
                <span>${escape(event.ngo)}</span>
              </div>
            `).join("")}
          </div>
        `).join("")}
      </div>
    </div>
  </div>`}
</body>
</html>`;
    }

    function downloadAcceptedSchedule() {
      const html = buildScheduleHtml();
      const blob = new Blob([html], { type: "text/html" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `civicconnect-accepted-schedule-${new Date().toISOString().slice(0, 10)}.html`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function truncateText(value, length = 82) {
      if (!value) return "No description provided.";
      return value.length > length ? `${value.slice(0, length)}...` : value;
    }

    function escapeHTML(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function resolvedStatus(app) {
      if (app.completion_status === "attended") return "completed";
      if (app.completion_status === "no_show") return "no-show";
      return app.status || "pending";
    }

    function statusIcon(status) {
      if (status === "accepted" || status === "completed") return "fa-circle-check";
      if (status === "rejected" || status === "no-show") return "fa-circle-xmark";
      if (status === "withdrawn") return "fa-circle-minus";
      return "fa-hourglass-half";
    }

    function scheduleSummary(app) {
      return `${formatScheduleDays(app.schedule_days)} | ${formatTime(app.start_time)}-${formatTime(app.end_time)} | ${formatHours(app.hours_required)} hrs total`;
    }

    function certificateState(app) {
      if (app.status !== "accepted") {
        return {
          key: "not-eligible",
          label: "Not eligible",
          message: "Certificate unlocks after your application is accepted and attendance is confirmed."
        };
      }
      if (app.attendance_confirmed !== "YES") {
        return {
          key: "pending",
          label: "Attendance pending",
          message: "Certificate unlocks after the NGO confirms your attendance."
        };
      }
      if (localStorage.getItem(`certificateDownloaded:${app.application_id}`) === "true") {
        return {
          key: "ready",
          label: "Downloaded",
          message: "You have opened this certificate before. You can print it again or copy the verification link."
        };
      }
      return {
        key: "ready",
        label: "Ready to download",
        message: "Your certificate is ready. You can preview it, print it, or copy its verification link."
      };
    }

    function progressStrip(app) {
      const accepted = app.status === "accepted";
      const withdrawn = app.status === "withdrawn";
      const rejected = app.status === "rejected";
      const attended = app.attendance_confirmed === "YES";
      const noShow = app.completion_status === "no_show";
      const hasCertificate = accepted && attended;
      const hasFeedback = Boolean(app.opportunity_feedback_id);
      return `
        <div class="progress-strip" aria-label="Application progress">
          <div class="progress-step done">
            <i class="fas fa-paper-plane"></i>
            Applied
          </div>
          <div class="progress-step ${accepted ? "done" : (rejected || withdrawn) ? "blocked" : "current"}">
            <i class="fas ${accepted ? "fa-circle-check" : rejected ? "fa-circle-xmark" : withdrawn ? "fa-circle-minus" : "fa-hourglass-half"}"></i>
            ${accepted ? "Accepted" : rejected ? "Rejected" : withdrawn ? "Withdrawn" : "Pending"}
          </div>
          <div class="progress-step ${attended ? "done" : noShow ? "blocked" : accepted ? "current" : "blocked"}">
            <i class="fas ${attended ? "fa-clipboard-check" : noShow ? "fa-user-xmark" : "fa-user-clock"}"></i>
            ${attended ? "Attended" : noShow ? "No-show" : "Attendance"}
          </div>
          <div class="progress-step ${hasCertificate ? "done" : "blocked"}">
            <i class="fas fa-certificate"></i>
            ${hasCertificate ? "Certificate" : "Locked"}
          </div>
          <div class="progress-step ${hasFeedback ? "done" : attended ? "current" : "blocked"}">
            <i class="fas fa-star"></i>
            ${hasFeedback ? "Feedback" : attended ? "Feedback" : "Locked"}
          </div>
        </div>
      `;
    }

    function schedulePanel(app) {
      return `
        <div class="schedule-panel">
          <h3>Schedule</h3>
          <div class="schedule-grid-card">
            <div class="schedule-item">
              <i class="fas fa-calendar-plus"></i>
              <span><small>Applied</small>${formatDate(app.applied_at)}</span>
            </div>
            <div class="schedule-item">
              <i class="fas fa-calendar-days"></i>
              <span><small>Opportunity Dates</small>${formatDate(app.start_date)} - ${formatDate(app.end_date)}</span>
            </div>
            <div class="schedule-item">
              <i class="fas fa-calendar-week"></i>
              <span><small>Days</small>${formatScheduleDays(app.schedule_days)}</span>
            </div>
            <div class="schedule-item">
              <i class="fas fa-business-time"></i>
              <span><small>Time</small>${formatTime(app.start_time)} - ${formatTime(app.end_time)}</span>
            </div>
            <div class="schedule-item">
              <i class="fas fa-clock"></i>
              <span><small>Required Hours</small>${formatHours(app.hours_required)} hours</span>
            </div>
            <div class="schedule-item">
              <i class="fas fa-award"></i>
              <span><small>Confirmed Hours</small>${app.attendance_confirmed === "YES" ? `${formatHours(app.hours_completed)} hours completed` : "Not confirmed yet"}</span>
            </div>
          </div>
        </div>
      `;
    }

    function toggleCardDetails(applicationId) {
      const card = document.getElementById(`application-card-${applicationId}`);
      const button = document.getElementById(`toggle-card-${applicationId}`);
      if (!card || !button) return;
      const expanded = card.classList.toggle("expanded");
      button.innerHTML = expanded
        ? '<i class="fas fa-chevron-up"></i> Less'
        : '<i class="fas fa-chevron-down"></i> More';
    }

    function toggleActionMenu(applicationId) {
      document.querySelectorAll(".action-menu.open").forEach(menu => {
        if (menu.id !== `action-menu-${applicationId}`) menu.classList.remove("open");
      });
      const menu = document.getElementById(`action-menu-${applicationId}`);
      if (menu) menu.classList.toggle("open");
    }

    const feedbackTags = [
      "Well organized",
      "Clear communication",
      "Meaningful work",
      "Supportive team",
      "Needed better coordination",
      "Good for first-time volunteers"
    ];

    function toggleFeedbackTag(applicationId, tag) {
      const button = document.querySelector(`[data-feedback-tag="${applicationId}-${CSS.escape(tag)}"]`);
      if (button) button.classList.toggle("active");
    }

    function selectedFeedbackTags(applicationId) {
      return Array.from(document.querySelectorAll(`[data-feedback-app="${applicationId}"].active`))
        .map(button => button.dataset.tag)
        .filter(Boolean);
    }

    function updateFeedbackCounter(applicationId) {
      const textarea = document.getElementById(`comment-${applicationId}`);
      const counter = document.getElementById(`comment-count-${applicationId}`);
      if (textarea && counter) counter.textContent = `${textarea.value.length}/1200`;
    }

    function feedbackSection(app) {
      let ngoFeedback = "";
      if (app.volunteer_feedback_id) {
        const alreadyAdded = Number(app.volunteer_feedback_show_on_profile) === 1;
        ngoFeedback = `
          <div class="received-feedback">
            <strong>NGO endorsement: ${escapeHTML(app.volunteer_feedback_title || "Volunteer feedback")}</strong>
            <div class="rating-line">${Number(app.volunteer_feedback_rating) || 0}/5 rating</div>
            <p>${escapeHTML(app.volunteer_feedback_comment || "")}</p>
            ${app.volunteer_feedback_strengths ? `<small><strong>Strengths:</strong> ${escapeHTML(app.volunteer_feedback_strengths)}</small>` : ""}
            <div style="margin-top:12px;">
              ${alreadyAdded ? `
                <span class="field-badge"><i class="fas fa-circle-check"></i> Added to profile</span>
              ` : `
                <button class="feedback-button" type="button" onclick="addEndorsementToProfile(${app.volunteer_feedback_id})">
                  <i class="fas fa-user-plus"></i> Add to Profile
                </button>
              `}
            </div>
          </div>
        `;
      }

      const existing = Boolean(app.opportunity_feedback_id);
      const volunteerFeedback = existing ? `
        <div class="feedback-panel">
          <div class="received-feedback">
            <strong>Your opportunity feedback was submitted.</strong>
            <p>The NGO can now see it. Feedback can only be submitted once.</p>
          </div>
          ${ngoFeedback}
        </div>
      ` : app.status === "accepted" && app.attendance_confirmed === "YES" ? `
        <div class="feedback-panel">
          <h3>Feedback</h3>
          <p style="margin-bottom:12px;color:#486179;">Share your experience on a dedicated feedback page.</p>
          <a class="feedback-button" href="volunteer-feedback.html?application_id=${app.application_id}">
            <i class="fas fa-star"></i> Give Feedback
          </a>
          ${ngoFeedback}
        </div>
      ` : ngoFeedback ? `<div class="feedback-panel">${ngoFeedback}</div>` : "";

      return volunteerFeedback;
    }

    async function saveOpportunityFeedback(applicationId) {
      const rating = document.getElementById(`rating-${applicationId}`).value;
      const commentValue = document.getElementById(`comment-${applicationId}`).value.trim();
      const impact_story = document.getElementById(`impact-${applicationId}`).value.trim();
      const tags = selectedFeedbackTags(applicationId);
      const comment = tags.length
        ? `Tags: ${tags.join(", ")}\n\n${commentValue}`.trim()
        : commentValue;

      try {
        const response = await fetch(`/api/feedback/opportunity/${applicationId}`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`
          },
          body: JSON.stringify({ rating, comment, impact_story })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || "Could not save feedback.");
        showAlert(data.message || "Feedback submitted. Thank you for helping future volunteers choose well.", () => { loadApplications(); });
      } catch (err) {
        showAlert(err.message);
      }
    }

    async function addEndorsementToProfile(feedbackId) {
      try {
        const response = await fetch(`/api/feedback/volunteer/${feedbackId}/profile`, {
          method: "PATCH",
          headers: { Authorization: `Bearer ${token}` }
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || "Could not add endorsement to profile.");
        showAlert(data.message || "Endorsement added to profile.", () => { loadApplications(); });
      } catch (err) {
        showAlert(err.message);
      }
    }

    async function withdrawApplication(applicationId) {
      showConfirm("Withdraw this application? This cannot be undone.", async () => {
        try {
          const response = await fetch(`/api/applications/${applicationId}/withdraw`, {
            method: "PATCH",
            headers: { Authorization: `Bearer ${token}` }
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(data.error || "Could not withdraw application.");
          await loadApplications();
        } catch (err) {
          showAlert(err.message);
        }
      });
    }

    function renderApplications() {
      const container = document.getElementById("history-container");
      const filtered = activeFilter === "all"
        ? applications
        : applications.filter(app => resolvedStatus(app) === activeFilter);
      const completedHours = applications.reduce((total, app) => {
        if (app.attendance_confirmed !== "YES") return total;
        return total + (Number(app.hours_completed) || 0);
      }, 0);

      document.getElementById("application-count").textContent = applications.length;
      document.getElementById("completed-hours-count").textContent = formatHours(completedHours);

      if (filtered.length === 0) {
        const message = activeFilter === "all"
          ? "You have not applied to any opportunities yet."
          : `No ${activeFilter} applications found.`;
        container.className = "empty-state";
        container.innerHTML = `
          <i class="fas fa-folder-open"></i>
          <h2>No Applications</h2>
          <p>${message}</p>
        `;
        return;
      }

      container.className = "history-grid";
      container.innerHTML = filtered.map(app => {
        const status = resolvedStatus(app);
        const hasCertificateAction = app.attendance_confirmed === "YES";
        const hasFeedbackAction = app.status === "accepted" && app.attendance_confirmed === "YES";
        const canWithdraw = app.status === "pending";
        return `
        <article class="history-card" id="application-card-${app.application_id}">
          <div class="card-body">
            <div class="card-top">
              <span class="field-badge"><i class="fas fa-tag"></i>${escapeHTML(app.field || "General")}</span>
              <div class="card-top-right">
                <span class="status-badge status-${status}">
                  <i class="fas ${statusIcon(status)}"></i>${status}
                </span>
                ${canWithdraw ? `
                  <button type="button" onclick="withdrawApplication(${app.application_id})"
                    style="display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border:1px solid #e8c0c0;border-radius:999px;background:#fff5f5;color:#b42323;font-size:0.75rem;font-weight:800;cursor:pointer;white-space:nowrap;">
                    <i class="fas fa-circle-minus"></i> Withdraw
                  </button>` : ""}
              </div>
            </div>
            <h2>${escapeHTML(app.title)}</h2>
            <div class="card-subtitle">
              <span class="pill"><i class="fas fa-building"></i>${escapeHTML(app.ngo_name || "Unknown NGO")}</span>
              <span class="pill"><i class="fas fa-clock"></i>${formatHours(app.hours_required)} hrs required</span>
            </div>
            <p class="description">${escapeHTML(truncateText(app.description))}</p>
            <div class="summary-line">
              <span><i class="fas fa-calendar-days"></i>${formatDate(app.start_date)} - ${formatDate(app.end_date)}</span>
              <span><i class="fas fa-location-dot"></i>${escapeHTML(app.location || "No location")}</span>
              <span><i class="fas fa-award"></i>${app.attendance_confirmed === "YES" ? `${formatHours(app.hours_completed)} hrs completed` : "Hours pending"}</span>
              ${app.volunteer_feedback_id ? `<span><i class="fas fa-comment-dots"></i>NGO feedback available</span>` : ""}
            </div>
            <div class="card-extra">
              ${progressStrip(app)}
              ${schedulePanel(app)}
            </div>
          </div>
          <div class="card-actions">
            <button class="details-link toggle-details" type="button" id="toggle-card-${app.application_id}" onclick="toggleCardDetails(${app.application_id})">
              <i class="fas fa-chevron-down"></i> More
            </button>
            <div class="more-actions">
              <button class="details-link menu-button" type="button" aria-label="Open actions" onclick="toggleActionMenu(${app.application_id})">
                <i class="fas fa-ellipsis"></i>
              </button>
              <div class="action-menu" id="action-menu-${app.application_id}">
                ${app.volunteer_feedback_id ? `
                  <a class="menu-item" href="ngo-feedback-view.html?application_id=${app.application_id}">
                    <i class="fas fa-comment-dots"></i> View NGO Feedback
                  </a>` : ""}
                ${hasCertificateAction ? `
                  <button class="menu-item" type="button" onclick="previewCertificate(${app.application_id})">
                    <i class="fas fa-certificate"></i> Preview Certificate
                  </button>` : ""}
                ${hasFeedbackAction && !app.opportunity_feedback_id ? `
                  <a class="menu-item" href="volunteer-feedback.html?application_id=${app.application_id}">
                    <i class="fas fa-star"></i> Give Feedback
                  </a>` : ""}
                ${app.opportunity_feedback_id ? `
                  <a class="menu-item" href="volunteer-feedback.html?application_id=${app.application_id}">
                    <i class="fas fa-circle-check"></i> Feedback Sent
                  </a>` : ""}
              </div>
            </div>
          </div>
        </article>
      `;
      }).join("");
    }

    async function loadApplications() {
      if (!requireVolunteer()) return;

      try {
        const response = await fetch("/api/volunteer/applications", {
          headers: { Authorization: `Bearer ${token}` }
        });

        if (response.status === 401 || response.status === 403) {
          clearAuthStorage();
          window.location.href = "login.html";
          return;
        }

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || "Failed to load application history.");
        }

        applications = Array.isArray(data) ? data : [];
        renderApplications();
      } catch (err) {
        const container = document.getElementById("history-container");
        container.className = "error-state";
        container.innerHTML = `
          <i class="fas fa-triangle-exclamation"></i>
          <h2>Could not load applications</h2>
          <p>${err.message}</p>
        `;
      }
    }

    async function openCertificate(applicationId) {
      try {
        const response = await fetch(`/api/certificates/${applicationId}`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        const html = await response.text();
        if (!response.ok) throw new Error(html || "Could not generate certificate.");
        const blob = new Blob([html], { type: "text/html" });
        const url = URL.createObjectURL(blob);
        window.open(url, "_blank");
        localStorage.setItem(`certificateDownloaded:${applicationId}`, "true");
        renderApplications();
        setTimeout(() => URL.revokeObjectURL(url), 30000);
      } catch (err) {
        showAlert(err.message);
      }
    }

    function previewCertificate(applicationId) {
      const app = applications.find(item => Number(item.application_id) === Number(applicationId));
      if (!app || app.attendance_confirmed !== "YES") {
        showAlert("Certificate unlocks after the NGO confirms your attendance.");
        return;
      }
      currentCertificateApplicationId = applicationId;
      currentCertificateVerifyUrl = app.certificate_id
        ? `${window.location.origin}/api/certificates/verify/${encodeURIComponent(app.certificate_id)}`
        : "";
      document.getElementById("certificate-preview").innerHTML = `
        <div class="brand">CivicConnect</div>
        <h2 id="certificate-preview-title">Certificate of Volunteering</h2>
        <p>This certifies that</p>
        <h3>${escapeHTML(localStorage.getItem("userName") || "Volunteer")}</h3>
        <p>completed <strong>${formatHours(app.hours_completed)} volunteer hours</strong> for <strong>${escapeHTML(app.title)}</strong> with <strong>${escapeHTML(app.ngo_name || "NGO")}</strong>.</p>
        <p>${formatDate(app.start_date)} - ${formatDate(app.end_date)}</p>
        ${app.certificate_id ? `<p><strong>Verification ID:</strong> ${escapeHTML(app.certificate_id)}</p>` : ""}
      `;
      document.getElementById("certificate-modal").classList.add("open");
    }

    function closeCertificatePreview() {
      document.getElementById("certificate-modal").classList.remove("open");
    }

    function openCurrentCertificate() {
      if (currentCertificateApplicationId) openCertificate(currentCertificateApplicationId);
    }

    async function copyCurrentCertificateLink() {
      if (!currentCertificateVerifyUrl) {
        showAlert("Verification link is not available yet.");
        return;
      }
      await navigator.clipboard.writeText(currentCertificateVerifyUrl);
      showAlert("Verification link copied.");
    }

    document.querySelectorAll(".status-filters .filter-btn").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".status-filters .filter-btn").forEach(btn => btn.classList.remove("active"));
        button.classList.add("active");
        activeFilter = button.dataset.filter;
        renderApplications();
      });
    });

    document.getElementById("logout-btn").addEventListener("click", () => {
      clearAuthStorage();
      window.location.href = "login.html";
    });

    document.getElementById("download-schedule-btn").addEventListener("click", downloadAcceptedSchedule);

    document.addEventListener("click", event => {
      if (!event.target.closest(".more-actions")) {
        document.querySelectorAll(".action-menu.open").forEach(menu => menu.classList.remove("open"));
      }
    });

    document.addEventListener("DOMContentLoaded", loadApplications);
  </script>
</body>
</html>
