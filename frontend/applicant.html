<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Applicants - CivicConnect</title>
    <script src="notifications.js"></script>

    <link rel="stylesheet" href="dashboard.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .applicants-shell {
            max-width: 1120px;
            margin: 34px auto;
            padding: 0 18px;
        }

        .applicants-hero {
            padding: 24px;
            border: 1px solid rgba(255,255,255,0.16);
            border-radius: 18px;
            background: rgba(255,255,255,0.08);
            box-shadow: 0 16px 34px rgba(0,0,0,0.2);
            color: white;
        }

        .applicants-hero .text-muted {
            color: rgba(255,255,255,0.72) !important;
        }

        .filter-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
            margin: 18px 0;
            padding: 14px;
            border-radius: 14px;
            background: rgba(255,255,255,0.1);
        }

        .status-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .status-filter {
            border: 1px solid rgba(255,255,255,0.28);
            border-radius: 999px;
            padding: 9px 13px;
            color: white;
            background: rgba(255,255,255,0.08);
            font-weight: 800;
            cursor: pointer;
        }

        .status-filter.active {
            color: #10253d;
            background: white;
        }

        .applicant-count {
            color: rgba(255,255,255,0.78);
            font-weight: 800;
        }

        #applicantsList {
            display: grid;
            gap: 16px;
        }

        .applicant-card {
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.16) !important;
            border-radius: 18px !important;
            background: rgba(255,255,255,0.96) !important;
            color: #10253d !important;
        }

        .applicant-card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            padding: 18px;
            background: linear-gradient(90deg, #f7fbff, #fff7ef);
            border-bottom: 1px solid #e8eef5;
        }

        .applicant-avatar {
            width: 48px;
            height: 48px;
            flex: 0 0 48px;
            display: grid;
            place-items: center;
            border-radius: 12px;
            color: white;
            background: linear-gradient(135deg, #1e4fa3, #ff7a18);
            font-weight: 900;
        }

        .applicant-card-body {
            padding: 18px;
        }

        .mini-stat-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }

        .mini-stat {
            padding: 8px 10px;
            border-radius: 10px;
            background: #f4f7fa;
            color: #42566b;
            font-size: 0.9rem;
            font-weight: 700;
        }

        .action-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 16px;
        }

        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            margin: 0;
            -webkit-appearance: none;
        }

        input[type="number"] {
            appearance: textfield;
            -moz-appearance: textfield;
        }

        @media (max-width: 680px) {
            .applicants-hero,
            .filter-panel {
                padding: 16px;
            }

            .applicant-card-header {
                flex-direction: column;
            }
        }
    </style>
  <link rel="stylesheet" href="civic-ui.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">
                <span class="brand-logo-mark" aria-hidden="true">
                    <img src="logo.png" alt="">
                </span>
                CivicConnect
            </a>
        </div>
    </nav>

    <div class="applicants-shell">
        <a class="btn btn-secondary mb-3" href="dashboard.html">Back to Opportunities</a>
        <section class="applicants-hero">
            <h2 class="section-title" id="applicantTitle">Volunteer Applicants</h2>
            <p class="text-muted mb-0" id="applicantSubtitle">Review applicants for this opportunity, accept or reject requests, and confirm completed volunteer hours.</p>
            <div class="filter-panel">
                <div class="status-filters" aria-label="Filter applicants by status">
                    <button type="button" class="status-filter active" data-status="all">All <span id="count-all">0</span></button>
                    <button type="button" class="status-filter" data-status="pending">Waiting <span id="count-pending">0</span></button>
                    <button type="button" class="status-filter" data-status="accepted">Accepted <span id="count-accepted">0</span></button>
                    <button type="button" class="status-filter" data-status="rejected">Rejected <span id="count-rejected">0</span></button>
                </div>
                <div class="applicant-count" id="visibleCount">0 shown</div>
            </div>
        </section>
        <ul class="list-group mt-3" id="applicantsList"></ul>
    </div>

    <footer class="footer mt-4">
        &copy; 2025 CivicConnect. All rights reserved.
    </footer>

    <script src="applicant.js"></script>

</body>
</html>
