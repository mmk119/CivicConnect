<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply for Opportunity</title>
    <script src="notifications.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="apply.css">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="civic-ui.css">
</head>

<body>

<div class="container">
    <h2 class="title">Apply for Opportunity</h2>

    <form id="applicationForm">
        <input type="hidden" id="opportunityId">

        <div class="mb-3">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="email">Email</label>
            <input type="email" id="email" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="phone">Phone Number</label>
            <input type="text" id="phone" class="form-control" required>
        </div>

        <div class="form-actions">
            <button type="button" class="btn btn-success" onclick="applyForOpportunity()">Apply</button>
            <button type="button" class="btn btn-secondary" onclick="cancelApplication()">Cancel</button>
        </div>
    </form>
</div>

<script src="apply.js"></script>

</body>
</html>
