<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NGO Feedback | CivicConnect</title>
  <script src="notifications.js"></script>
  <script src="app-utils.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; font-family: Arial, sans-serif; color: #10253d; background: #eef4f9; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 42px;
      color: #fff;
      background: linear-gradient(90deg, #1087ee, #ff6800);
    }
    .brand, .back { color: #fff; text-decoration: none; font-weight: 900; }
    .shell { width: min(880px, calc(100% - 36px)); margin: 34px auto; }
    .eyebrow { color: #1285f3; font-size: 0.78rem; font-weight: 900; letter-spacing: 0.08em; text-transform: uppercase; }
    h1 { margin: 6px 0 20px; font-size: clamp(1.9rem, 4vw, 3rem); }
    .panel {
      border: 1px solid #d9e4ef;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 18px 42px rgba(16, 37, 61, 0.12);
      overflow: hidden;
    }
    .summary {
      padding: 22px;
      border-bottom: 1px solid #e4edf6;
      background: #f8fbff;
    }
    .summary h2 { margin-bottom: 8px; }
    .summary p { color: #506981; line-height: 1.55; }
    .feedback { padding: 24px; }
    .rating {
      display: inline-flex;
      gap: 7px;
      align-items: center;
      margin-bottom: 16px;
      padding: 9px 12px;
      border-radius: 999px;
      color: #805100;
      background: #fff4d8;
      font-weight: 900;
    }
    .feedback h3 { margin-bottom: 8px; font-size: 1.5rem; }
    .feedback p { color: #385672; line-height: 1.7; font-size: 1.05rem; }
    .strengths {
      margin-top: 18px;
      padding: 14px;
      border: 1px solid #c9eeee;
      border-radius: 12px;
      color: #12304c;
      background: #eef8f8;
      line-height: 1.55;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 11px 14px;
      border: 1px solid #cbd8e6;
      border-radius: 10px;
      color: #10253d;
      background: #fff;
      text-decoration: none;
      font-weight: 900;
      cursor: pointer;
    }
    .primary { border-color: #1285f3; color: #fff; background: #1285f3; }
    .note {
      padding: 22px;
      color: #805100;
      background: #fff8e6;
      border: 1px solid #ffe0a3;
      border-radius: 14px;
      line-height: 1.5;
      font-weight: 800;
    }
    @media (max-width: 680px) {
      .topbar { padding: 16px 20px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="landingpage.html">CivicConnect</a>
    <a class="back" href="application-history.html">Back</a>
  </header>

  <main class="shell">
    <div class="eyebrow">Feedback From NGO</div>
    <h1>Your Volunteer Endorsement</h1>
    <section id="content" class="panel">
      <div class="feedback">Loading feedback...</div>
    </section>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const applicationId = Number(params.get("application_id"));

    function escapeHTML(value) {
      return CivicConnect.escapeHTML(value);
    }

    function render(app) {
      const content = document.getElementById("content");
      if (!app.volunteer_feedback_id) {
        content.className = "";
        content.innerHTML = `
          <div class="note">
            No NGO feedback has been submitted for this application yet.
          </div>
        `;
        return;
      }

      const alreadyAdded = Number(app.volunteer_feedback_show_on_profile) === 1;
      content.className = "panel";
      content.innerHTML = `
        <div class="summary">
          <h2>${escapeHTML(app.title || "Opportunity")}</h2>
          <p>${escapeHTML(app.ngo_name || "NGO")} shared this feedback after your confirmed participation.</p>
        </div>
        <div class="feedback">
          <div class="rating"><i class="fa fa-star"></i>${Number(app.volunteer_feedback_rating) || 0}/5 rating</div>
          <h3>${escapeHTML(app.volunteer_feedback_title || "Volunteer feedback")}</h3>
          <p>${escapeHTML(app.volunteer_feedback_comment || "")}</p>
          ${app.volunteer_feedback_strengths ? `
            <div class="strengths">
              <strong>Strengths noticed:</strong><br>
              ${escapeHTML(app.volunteer_feedback_strengths)}
            </div>
          ` : ""}
          <div class="actions">
            ${alreadyAdded ? `
              <span class="button"><i class="fa fa-circle-check"></i> Added to profile</span>
            ` : `
              <button class="button primary" type="button" onclick="addToProfile(${app.volunteer_feedback_id})">
                <i class="fa fa-user-plus"></i> Add to Profile
              </button>
            `}
            <a class="button" href="application-history.html"><i class="fa fa-arrow-left"></i> Back to History</a>
          </div>
        </div>
      `;
    }

    async function addToProfile(feedbackId) {
      try {
        await CivicConnect.apiRequest(`/api/feedback/volunteer/${feedbackId}/profile`, {
          method: "PATCH",
          headers: CivicConnect.authHeaders()
        });
        showToast("Endorsement added to profile.", "success");
        await loadPage();
      } catch (err) {
        showToast(err.message || "Could not add endorsement.", "error");
      }
    }

    async function loadPage() {
      if (!Number.isInteger(applicationId) || applicationId < 1) {
        window.location.href = "application-history.html";
        return;
      }
      try {
        const applications = await CivicConnect.apiRequest("/api/volunteer/applications", {
          headers: CivicConnect.authHeaders()
        });
        const app = applications.find(item => Number(item.application_id) === applicationId);
        if (!app) throw new Error("Application not found.");
        render(app);
      } catch (err) {
        document.getElementById("content").className = "";
        document.getElementById("content").innerHTML = `<div class="note">${escapeHTML(err.message)}</div>`;
      }
    }

    loadPage();
  </script>
</body>
</html>
