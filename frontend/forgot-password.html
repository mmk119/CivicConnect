<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | CivicConnect</title>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;

            background:
                linear-gradient(rgba(10,25,50,0.85), rgba(10,25,50,0.95)),
                url('handinhand.png') no-repeat center center fixed;

            background-size: cover;

            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .auth-card {
            width: 420px;
            padding: 30px;
            border-radius: 20px;

            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(12px);

            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);

            color: white;
            text-align: center;
        }

        .logo {
            width: 90px;
            margin-bottom: 10px;
        }

        h3 {
            margin-bottom: 8px;
            color: white;
        }

        .subtitle {
            font-size: 14px;
            color: rgba(255,255,255,0.8);
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            text-align: left;
            margin-bottom: 5px;
            color: white;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.08);
            color: white;
            margin-bottom: 10px;
        }

        .form-control::placeholder {
            color: rgba(255,255,255,0.6);
        }

        .form-control:focus {
            outline: none;
            border-color: #4dabf7;
        }

        .primary-btn {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;

            background: linear-gradient(135deg, #ff7a18, #0d6efd);
            color: white;
            font-weight: bold;
            margin-top: 10px;

            transition: 0.2s;
        }

        .primary-btn:hover {
            transform: scale(1.05);
        }

        .link {
            display: inline-block;
            margin-top: 15px;
            color: #4dabf7;
            text-decoration: none;
        }

        .link:hover {
            text-decoration: underline;
        }

        .text-danger {
            font-size: 13px;
            color: #ff6b6b;
            text-align: left;
        }
    </style>
</head>

<body>

<div class="auth-card">

    <img src="logo.png" class="logo">

    <h3>Trouble logging in?</h3>
    <p class="subtitle">
        Enter your email and we’ll send you a reset link.
    </p>

    <form id="resetPasswordForm">

        <label class="form-label">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="user@domain.com" required>
        <div class="text-danger" id="emailError"></div>

        <button type="submit" class="primary-btn">
            Send Reset Link
        </button>

    </form>

    <a href="login.html" class="link">Back to Login</a>

</div>

<script>
document.getElementById("resetPasswordForm").addEventListener("submit", async function (event) {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const error = document.getElementById("emailError");

    error.textContent = "";

    const emailPattern = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/;

    if (!emailPattern.test(email)) {
        error.textContent = "Enter a valid email.";
        return;
    }

    try {
        const res = await fetch('/api/request-password-reset', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
        });

        const data = await res.json();

        if (!res.ok) throw new Error(data.error || "Failed");

        alert("Reset link sent if email exists.");

    } catch (err) {
        alert(err.message);
    }
});
</script>

</body>
</html>
