<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opportunity Feedback | CivicConnect</title>
  <script src="notifications.js"></script>
  <script src="app-utils.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #10253d;
      background: #eef4f9;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 42px;
      color: #fff;
      background: linear-gradient(90deg, #1087ee, #ff6800);
    }
    .brand { color: #fff; text-decoration: none; font-size: 1.35rem; font-weight: 900; }
    .shell { width: min(980px, calc(100% - 36px)); margin: 34px auto; }
    .page-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: end;
      margin-bottom: 20px;
    }
    .eyebrow {
      color: #1285f3;
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    h1 { margin-top: 6px; font-size: clamp(1.9rem, 4vw, 3rem); }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 42px;
      padding: 10px 14px;
      border: 1px solid #cbd8e6;
      border-radius: 10px;
      color: #10253d;
      background: #fff;
      text-decoration: none;
      font-weight: 900;
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(280px, 0.9fr) minmax(0, 1.4fr);
      gap: 20px;
      align-items: start;
    }
    .panel {
      border: 1px solid #d9e4ef;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 18px 42px rgba(16, 37, 61, 0.12);
    }
    .summary { padding: 22px; }
    .summary h2 { margin-bottom: 10px; font-size: 1.35rem; }
    .summary p { color: #506981; line-height: 1.55; }
    .facts { display: grid; gap: 10px; margin-top: 18px; }
    .fact {
      display: flex;
      gap: 10px;
      padding: 11px;
      border-radius: 11px;
      background: #f4f8fc;
      color: #395872;
      font-weight: 800;
    }
    .fact i { color: #1285f3; margin-top: 2px; }
    .form-panel { padding: 24px; }
    .step { margin-bottom: 20px; }
    .step label, .step-title {
      display: block;
      margin-bottom: 8px;
      color: #173b5b;
      font-weight: 900;
    }
    select, input, textarea {
      width: 100%;
      min-height: 46px;
      padding: 12px;
      border: 1px solid #cbd8e6;
      border-radius: 10px;
      font: inherit;
    }
    textarea { min-height: 150px; resize: vertical; }
    .tag-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .tag {
      border: 1px solid #cbd8e6;
      border-radius: 999px;
      padding: 9px 12px;
      background: #fff;
      color: #31506d;
      font-weight: 900;
      cursor: pointer;
    }
    .tag.active { border-color: #1285f3; background: #e7f4ff; color: #0877da; }
    .counter { margin-top: 6px; color: #70869a; text-align: right; font-size: 0.86rem; font-weight: 800; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .primary {
      min-height: 46px;
      padding: 12px 16px;
      border: 0;
      border-radius: 10px;
      color: #fff;
      background: #1285f3;
      font-weight: 900;
      cursor: pointer;
    }
    .note {
      padding: 14px;
      border: 1px solid #ffe0a3;
      border-radius: 12px;
      color: #805100;
      background: #fff8e6;
      line-height: 1.45;
    }
    @media (max-width: 780px) {
      .topbar { padding: 16px 20px; }
      .page-head, .layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="landingpage.html">CivicConnect</a>
    <a class="back-link" href="application-history.html">Back</a>
  </header>

  <main class="shell">
    <div class="page-head">
      <div>
        <div class="eyebrow">Volunteer Feedback</div>
        <h1>Share Your Experience</h1>
      </div>
      <a class="back-link" href="application-history.html"><i class="fa fa-arrow-left"></i> Application History</a>
    </div>

    <section class="layout">
      <aside class="panel summary" id="summary-panel">
        <h2>Loading opportunity...</h2>
      </aside>

      <section class="panel form-panel" id="form-panel">
        <div class="note">Loading feedback form...</div>
      </section>
    </section>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const applicationId = Number(params.get("application_id"));
    const token = localStorage.getItem("token");
    const tags = [
      "Well organized",
      "Clear communication",
      "Meaningful work",
      "Supportive team",
      "Needed better coordination",
      "Good for first-time volunteers"
    ];

    function escapeHTML(value) {
      return CivicConnect.escapeHTML(value);
    }

    function formatDate(value) {
      if (!value) return "TBD";
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? "TBD" : date.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
    }

    function formatTime(value) {
      return value ? String(value).slice(0, 5) : "TBD";
    }

    function selectedTags() {
      return Array.from(document.querySelectorAll(".tag.active")).map(button => button.dataset.tag);
    }

    function updateCounter() {
      const textarea = document.getElementById("comment");
      const counter = document.getElementById("counter");
      if (textarea && counter) counter.textContent = `${textarea.value.length}/1200`;
    }

    function renderSummary(app) {
      document.getElementById("summary-panel").innerHTML = `
        <h2>${escapeHTML(app.title)}</h2>
        <p>${escapeHTML(app.description || "No description provided.")}</p>
        <div class="facts">
          <div class="fact"><i class="fa fa-building"></i><span>${escapeHTML(app.ngo_name || "NGO")}</span></div>
          <div class="fact"><i class="fa fa-calendar-days"></i><span>${formatDate(app.start_date)} - ${formatDate(app.end_date)}</span></div>
          <div class="fact"><i class="fa fa-business-time"></i><span>${formatTime(app.start_time)} - ${formatTime(app.end_time)}</span></div>
          <div class="fact"><i class="fa fa-award"></i><span>${Number(app.hours_completed) || 0} hours completed</span></div>
        </div>
      `;
    }

    function renderForm(app) {
      const formPanel = document.getElementById("form-panel");
      if (app.opportunity_feedback_id) {
        formPanel.innerHTML = `
          <div class="note">
            <strong>Feedback already submitted.</strong><br>
            You can only submit opportunity feedback once.
          </div>
        `;
        return;
      }
      if (app.status !== "accepted" || app.attendance_confirmed !== "YES") {
        formPanel.innerHTML = `
          <div class="note">
            Feedback unlocks after your application is accepted and attendance is confirmed.
          </div>
        `;
        return;
      }

      formPanel.innerHTML = `
        <div class="step">
          <label for="rating">1. Overall rating</label>
          <select id="rating">
            ${[5, 4, 3, 2, 1].map(value => `<option value="${value}">${value} star${value === 1 ? "" : "s"}</option>`).join("")}
          </select>
        </div>
        <div class="step">
          <div class="step-title">2. Quick tags</div>
          <div class="tag-row">
            ${tags.map(tag => `<button class="tag" type="button" data-tag="${escapeHTML(tag)}">${escapeHTML(tag)}</button>`).join("")}
          </div>
        </div>
        <div class="step">
          <label for="impact">3. Optional impact note</label>
          <input id="impact" maxlength="800" placeholder="What changed because of this work?">
        </div>
        <div class="step">
          <label for="comment">4. Public comment</label>
          <textarea id="comment" maxlength="1200" placeholder="Tell future volunteers what the experience was like."></textarea>
          <div class="counter" id="counter">0/1200</div>
        </div>
        <div class="note" style="margin-bottom:16px;">This feedback may appear publicly on the opportunity page after moderation. Reports are separate and private to admins.</div>
        <div class="actions">
          <button class="primary" type="button" id="submit-feedback"><i class="fa fa-paper-plane"></i> Submit Feedback</button>
        </div>
      `;
      document.querySelectorAll(".tag").forEach(button => {
        button.addEventListener("click", () => button.classList.toggle("active"));
      });
      document.getElementById("comment").addEventListener("input", updateCounter);
      document.getElementById("submit-feedback").addEventListener("click", submitFeedback);
    }

    async function submitFeedback() {
      const rating = document.getElementById("rating").value;
      const impact_story = document.getElementById("impact").value.trim();
      const commentValue = document.getElementById("comment").value.trim();
      const chosenTags = selectedTags();
      const comment = chosenTags.length ? `Tags: ${chosenTags.join(", ")}\n\n${commentValue}`.trim() : commentValue;

      try {
        await CivicConnect.apiRequest(`/api/feedback/opportunity/${applicationId}`, {
          method: "POST",
          headers: CivicConnect.authHeaders({ "Content-Type": "application/json" }),
          body: JSON.stringify({ rating, impact_story, comment })
        });
        showToast("Feedback submitted.", "success");
        window.location.href = "application-history.html";
      } catch (err) {
        showToast(err.message || "Could not submit feedback.", "error");
      }
    }

    async function loadPage() {
      if (!token || !Number.isInteger(applicationId) || applicationId < 1) {
        window.location.href = "application-history.html";
        return;
      }
      try {
        const applications = await CivicConnect.apiRequest("/api/volunteer/applications", {
          headers: CivicConnect.authHeaders()
        });
        const app = applications.find(item => Number(item.application_id) === applicationId);
        if (!app) throw new Error("Application not found.");
        renderSummary(app);
        renderForm(app);
      } catch (err) {
        document.getElementById("form-panel").innerHTML = `<div class="note">${escapeHTML(err.message)}</div>`;
      }
    }

    loadPage();
  </script>
</body>
</html>
