<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Volunteering Opportunity</title>
  <script src="notifications.js"></script>

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;

      background:
        linear-gradient(rgba(10,25,50,0.85), rgba(10,25,50,0.95)),
        url('handinhand.jpeg') no-repeat center center fixed;

      background-size: cover;

      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      max-width: 800px;
      width: 90%;

      padding: 30px;
      border-radius: 20px;

      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(12px);

      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);

      color: white;
    }

    .logo {
      width: 90px;
      margin-bottom: 10px;
    }

    h1 {
      color: #4dabf7;
      text-align: center;
      margin-bottom: 20px;
    }

    .section {
      margin-bottom: 20px;
    }

    .section h3 {
      color: #4dabf7;
      margin-bottom: 5px;
    }

    .section p {
      color: rgba(255,255,255,0.9);
    }

    strong {
      color: white;
    }

    .apply-button {
      display: block;
      text-align: center;

      background: linear-gradient(135deg, #ff7a18, #0d6efd);
      color: white;

      padding: 12px;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;

      border-radius: 10px;
      margin-top: 20px;
      transition: 0.2s;
    }

    .apply-button:hover {
      transform: scale(1.05);
    }

    .toast-message {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 3000;
      max-width: min(420px, calc(100% - 32px));
      padding: 16px 18px;
      border-radius: 12px;
      color: #fff;
      background: #12385f;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
      font-weight: 700;
      line-height: 1.45;
      opacity: 0;
      transform: translateY(18px);
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .toast-message.show {
      opacity: 1;
      transform: translateY(0);
    }

    .toast-message.success {
      background: #198754;
    }

    .toast-message.error {
      background: #dc3545;
    }
  </style>
</head>

<body>

  <div class="container">

    <div style="text-align:center;">
      <img src="logo.png" class="logo">
    </div>

    <h1 id="opportunity-title"></h1>

    <div class="section">
      <h3>Field</h3>
      <p id="opportunity-field"></p>
    </div>

    <div class="section">
      <h3>Description</h3>
      <p id="opportunity-description"></p>
    </div>

    <div class="section">
      <h3>Location</h3>
      <p id="opportunity-location"></p>
    </div>

    <div class="section">
      <h3>Date & Time Commitment</h3>
      <p id="opportunity-date"></p>
      <p id="opportunity-time"></p>
      <p id="opportunity-hours"></p>
      <p id="opportunity-capacity"></p>
    </div>

    <div class="section">
      <h3>NGO Info</h3>
      <p><strong>Name:</strong> <a id="ngo-link" href="#" style="color:#4dabf7;"><span id="ngo-name"></span></a></p>
    </div>

    <a href="#" class="apply-button" id="applyButton" onclick="applyForOpportunity(event, oppId)">
      Apply Now
    </a>

  </div>

  <div id="toastMessage" class="toast-message" role="status" aria-live="polite"></div>

  <script>
    let oppId = null;
    let currentOpportunity = null;
    let toastTimer = null;

    function showToast(message, type = 'info') {
      const toast = document.getElementById('toastMessage');
      if (!toast) return;
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.className = `toast-message ${type} show`;
      toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 3400);
    }
    const params = new URLSearchParams(window.location.search);
    oppId = params.get('id');

    if (!oppId) {
      showToast("No opportunity was selected.", "error");
    } else {
      fetchOpportunity(oppId);
    }

    function fetchOpportunity(id) {
      fetch(`api/opportunities/${id}`)
        .then(res => {
          if (!res.ok) {
            return res.json().then(j => { throw new Error(j.error || res.statusText) });
          }
          return res.json();
        })
        .then(data => {
          currentOpportunity = data;
          document.getElementById('opportunity-title').textContent = data.title;
          document.getElementById('opportunity-field').textContent = data.field || 'Not specified';
          document.getElementById('opportunity-description').textContent = data.description;
          document.getElementById('opportunity-location').textContent = data.location;

          document.getElementById('opportunity-date').textContent =
            `Starts: ${new Date(data.start_date).toLocaleDateString()}`;

          document.getElementById('opportunity-time').textContent =
            `Ends: ${new Date(data.end_date).toLocaleDateString()}`;

          document.getElementById('opportunity-hours').textContent =
            `Hours Required: ${data.hours_required || 0}`;
          document.getElementById('opportunity-capacity').textContent =
            `Volunteers Accepted: ${data.accepted_count || 0}/${data.capacity || 'Open'}`;

          document.getElementById('ngo-name').textContent = data.ngo_name;
          document.getElementById('ngo-link').href = `ngo-public.html?id=${data.ngo_id}`;

          const capacity = Number(data.capacity) || 0;
          const accepted = Number(data.accepted_count) || 0;
          if (capacity > 0 && accepted >= capacity) {
            const applyButton = document.getElementById('applyButton');
            applyButton.textContent = 'Opportunity Full';
            applyButton.style.pointerEvents = 'none';
            applyButton.style.background = '#6c757d';
          }
        })
        .catch(err => {
          console.error(err);
          showToast(`Could not load opportunity: ${err.message}`, "error");
        });
    }

    function clearAuthStorage() {
      localStorage.removeItem("token");
      localStorage.removeItem("userRole");
      localStorage.removeItem("user_id");
      localStorage.removeItem("ngo_id");
    }

    function getTokenPayload() {
      const token = localStorage.getItem("token");
      if (!token) return null;

      try {
        const payload = JSON.parse(atob(token.split(".")[1]));
        const currentTime = Math.floor(Date.now() / 1000);
        if (payload.exp && payload.exp < currentTime) {
          clearAuthStorage();
          return null;
        }
        return payload;
      } catch (error) {
        clearAuthStorage();
        return null;
      }
    }

    function canApplyToOpportunities() {
      return getTokenPayload()?.role === "Volunteer";
    }

    async function applyForOpportunity(event, opportunityId) {
      event.preventDefault();

      if (!canApplyToOpportunities()) {
        clearAuthStorage();
        window.location.href = 'login.html';
        return;
      }

      const applyButton = document.getElementById('applyButton');
      if (
        currentOpportunity &&
        Number(currentOpportunity.capacity) > 0 &&
        Number(currentOpportunity.accepted_count) >= Number(currentOpportunity.capacity)
      ) {
        showToast('This opportunity is full and no longer accepts applications.', 'error');
        return;
      }

      applyButton.style.pointerEvents = 'none';
      applyButton.textContent = 'Submitting...';

      try {
        const response = await fetch('/api/applications', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${localStorage.getItem('token')}`
          },
          body: JSON.stringify({ opportunity_id: opportunityId })
        });

        if (!response.ok) {
          const err = await response.json();
          throw new Error(err.error || "Failed");
        }

        showToast('Application submitted successfully.', 'success');
        applyButton.textContent = 'Applied';
      } catch (error) {
        showToast(error.message, 'error');
        applyButton.style.pointerEvents = '';
        applyButton.textContent = 'Apply Now';
      }
    }
  </script>

</body>
</html>
