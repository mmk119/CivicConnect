<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Volunteering Opportunity</title>
  <script src="notifications.js"></script>

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;

      background:
        linear-gradient(rgba(10,25,50,0.85), rgba(10,25,50,0.95)),
        url('handinhand.png') no-repeat center center fixed;

      background-size: cover;

      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      max-width: 800px;
      width: 90%;

      padding: 30px;
      border-radius: 20px;

      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(12px);

      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);

      color: white;
    }

    .logo {
      width: 90px;
      margin-bottom: 10px;
    }

    h1 {
      color: #4dabf7;
      text-align: center;
      margin-bottom: 20px;
    }

    .section {
      margin-bottom: 20px;
    }

    .section h3 {
      color: #4dabf7;
      margin-bottom: 5px;
    }

    .section p {
      color: rgba(255,255,255,0.9);
    }

    strong {
      color: white;
    }

    .apply-button {
      display: block;
      text-align: center;

      background: linear-gradient(135deg, #ff7a18, #0d6efd);
      color: white;

      padding: 12px;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;

      border-radius: 10px;
      margin-top: 20px;
      transition: 0.2s;
    }

    .apply-button:hover {
      transform: scale(1.05);
    }

    .feedback-summary {
      margin-top: 22px;
      padding: 18px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .feedback-card {
      padding: 14px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
    }

    .feedback-card:first-of-type {
      border-top: none;
    }

    .feedback-stars {
      color: #ffb347;
      font-weight: 900;
    }

    .toast-message {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 3000;
      max-width: min(420px, calc(100% - 32px));
      padding: 16px 18px;
      border-radius: 12px;
      color: #fff;
      background: #12385f;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
      font-weight: 700;
      line-height: 1.45;
      opacity: 0;
      transform: translateY(18px);
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .toast-message.show {
      opacity: 1;
      transform: translateY(0);
    }

    .toast-message.success {
      background: #198754;
    }

    .toast-message.error {
      background: #dc3545;
    }
  </style>
  <link rel="stylesheet" href="civic-ui.css">
</head>

<body>

  <div class="container">

    <div style="text-align:center;">
      <img src="logo.png" class="logo">
    </div>

    <h1 id="opportunity-title"></h1>

    <div class="section">
      <h3>Field</h3>
      <p id="opportunity-field"></p>
    </div>

    <div class="section">
      <h3>Description</h3>
      <p id="opportunity-description"></p>
    </div>

    <div class="section">
      <h3>Location</h3>
      <p id="opportunity-location"></p>
    </div>

    <div class="section">
      <h3>Date & Time Commitment</h3>
      <p id="opportunity-date"></p>
      <p id="opportunity-time"></p>
      <p id="opportunity-days"></p>
      <p id="opportunity-timing"></p>
      <p id="opportunity-hours"></p>
      <p id="opportunity-capacity"></p>
    </div>

    <div class="section">
      <h3>NGO Info</h3>
      <p><strong>Name:</strong> <a id="ngo-link" href="#" style="color:#4dabf7;"><span id="ngo-name"></span></a></p>
    </div>

    <a href="#" class="apply-button" id="applyButton" onclick="applyForOpportunity(event, oppId)">
      Apply Now
    </a>

    <div class="section" id="applicationQuestionsBox" style="display:none;">
      <h3>Application Questions</h3>
      <div id="applicationQuestions"></div>
    </div>

    <div class="feedback-summary" id="feedbackSummary">
      <div class="section">
        <h3>Volunteer Feedback</h3>
        <p>Loading reviews...</p>
      </div>
    </div>

  </div>

  <div id="toastMessage" class="toast-message" role="status" aria-live="polite"></div>

  <script>
    let oppId = null;
    let currentOpportunity = null;
    let toastTimer = null;

    function showToast(message, type = 'info') {
      const toast = document.getElementById('toastMessage');
      if (!toast) return;
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.className = `toast-message ${type} show`;
      toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 3400);
    }
    const params = new URLSearchParams(window.location.search);
    oppId = params.get('id');

    const weekdayOrder = ["MON", "TUE", "WED", "THU", "FRI", "SAT", "SUN"];

    function formatScheduleDays(days) {
      const selected = Array.isArray(days) ? days : String(days || "").split(",");
      return weekdayOrder.filter(day => selected.includes(day)).join(", ") || "Days TBD";
    }

    function formatTime(value) {
      return value ? String(value).slice(0, 5) : "Time TBD";
    }

    function formatHours(value) {
      const hours = Number(value) || 0;
      return Number.isInteger(hours) ? String(hours) : hours.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
    }

    if (!oppId) {
      showToast("No opportunity was selected.", "error");
    } else {
      fetchOpportunity(oppId);
    }

    function fetchOpportunity(id) {
      fetch(`api/opportunities/${id}`)
        .then(res => {
          if (!res.ok) {
            return res.json().then(j => { throw new Error(j.error || res.statusText) });
          }
          return res.json();
        })
        .then(data => {
          currentOpportunity = data;
          document.getElementById('opportunity-title').textContent = data.title;
          document.getElementById('opportunity-field').textContent = data.field || 'Not specified';
          document.getElementById('opportunity-description').textContent = data.description;
          document.getElementById('opportunity-location').textContent = data.location;

          document.getElementById('opportunity-date').textContent =
            `Starts: ${new Date(data.start_date).toLocaleDateString()}`;

          document.getElementById('opportunity-time').textContent =
            `Ends: ${new Date(data.end_date).toLocaleDateString()}`;
          document.getElementById('opportunity-days').textContent =
            `Days: ${formatScheduleDays(data.schedule_days)}`;
          document.getElementById('opportunity-timing').textContent =
            `Timing: ${formatTime(data.start_time)} - ${formatTime(data.end_time)}`;

          document.getElementById('opportunity-hours').textContent =
            `Hours Required: ${formatHours(data.hours_required)}`;
          document.getElementById('opportunity-capacity').textContent =
            `Volunteers Accepted: ${data.accepted_count || 0}/${data.capacity || 'Open'}`;

          document.getElementById('ngo-name').textContent = data.ngo_name;
          document.getElementById('ngo-link').href = `ngo-public.html?id=${data.ngo_id}`;
          renderApplicationQuestions(parseQuestions(data.application_questions));

          const capacity = Number(data.capacity) || 0;
          const accepted = Number(data.accepted_count) || 0;
          if (capacity > 0 && accepted >= capacity) {
            const applyButton = document.getElementById('applyButton');
            applyButton.textContent = 'Opportunity Full';
            applyButton.style.pointerEvents = 'none';
            applyButton.style.background = '#6c757d';
          }
        })
        .catch(err => {
          console.error(err);
          showToast(`Could not load opportunity: ${err.message}`, "error");
        });
    }

    function clearAuthStorage() {
      localStorage.removeItem("token");
      localStorage.removeItem("userRole");
      localStorage.removeItem("user_id");
      localStorage.removeItem("ngo_id");
    }

    function getTokenPayload() {
      const token = localStorage.getItem("token");
      if (!token) return null;

      try {
        const payload = JSON.parse(atob(token.split(".")[1]));
        const currentTime = Math.floor(Date.now() / 1000);
        if (payload.exp && payload.exp < currentTime) {
          clearAuthStorage();
          return null;
        }
        return payload;
      } catch (error) {
        clearAuthStorage();
        return null;
      }
    }

    function canApplyToOpportunities() {
      return getTokenPayload()?.role === "Volunteer";
    }

    function escapeHTML(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function parseQuestions(value) {
      if (!value) return [];
      if (Array.isArray(value)) return value;
      try {
        const parsed = JSON.parse(value);
        return Array.isArray(parsed) ? parsed : [];
      } catch {
        return [];
      }
    }

    function renderApplicationQuestions(questions) {
      const box = document.getElementById('applicationQuestionsBox');
      const holder = document.getElementById('applicationQuestions');
      if (!questions.length) {
        box.style.display = 'none';
        holder.innerHTML = '';
        return;
      }

      box.style.display = '';
      holder.innerHTML = questions.map((question, index) => `
        <label style="display:block;margin:12px 0 6px;font-weight:700;" for="answer-${index}">
          ${escapeHTML(question)}
        </label>
        <textarea id="answer-${index}" rows="3" maxlength="800"
          style="width:100%;border-radius:10px;border:1px solid #d8e2ef;padding:10px;"></textarea>
      `).join('');
    }

    function loadFeedback(id) {
      fetch(`api/opportunities/${id}/feedback`)
        .then(res => res.json())
        .then(data => {
          const box = document.getElementById("feedbackSummary");
          if (!data.reviews || data.reviews.length === 0) {
            box.innerHTML = `
              <div class="section">
                <h3>Volunteer Feedback</h3>
                <p>No feedback has been shared yet. Completed volunteers can add the first review.</p>
              </div>`;
            return;
          }

          box.innerHTML = `
            <div class="section">
              <h3>Volunteer Feedback</h3>
              <p><strong>${data.average_rating || "New"}/5</strong> average from ${data.total_reviews} review${data.total_reviews === 1 ? "" : "s"}</p>
            </div>
            ${data.reviews.map(review => `
              <div class="feedback-card">
                <div class="feedback-stars">${Number(review.rating) || 0}/5 rating</div>
                <p>${escapeHTML(review.comment)}</p>
                ${review.impact_story ? `<p><strong>Impact note:</strong> ${escapeHTML(review.impact_story)}</p>` : ""}
                <small>By ${escapeHTML(review.volunteer_name || "Volunteer")}</small>
                ${localStorage.getItem('token') ? `<br><button type="button" style="margin-top:8px;border:0;background:transparent;color:#b00020;font-weight:700;" onclick="reportFeedback(${review.opportunity_feedback_id})">Report</button>` : ""}
              </div>
            `).join("")}
          `;
        })
        .catch(() => {
          document.getElementById("feedbackSummary").innerHTML = `
            <div class="section">
              <h3>Volunteer Feedback</h3>
              <p>Reviews could not be loaded right now.</p>
            </div>`;
        });
    }

    async function reportFeedback(feedbackId) {
      const reason = prompt("Why should admin review this feedback? (harmful, abusive, unsafe, spam)");
      if (!reason) return;
      try {
        const response = await fetch(`/api/feedback/opportunity/${feedbackId}/report`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${localStorage.getItem('token')}`
          },
          body: JSON.stringify({ reason })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || 'Could not report feedback.');
        showToast(data.message || 'Report sent to admin.', 'success');
      } catch (error) {
        showToast(error.message, 'error');
      }
    }

    async function applyForOpportunity(event, opportunityId) {
      event.preventDefault();

      if (!canApplyToOpportunities()) {
        clearAuthStorage();
        window.location.href = 'login.html';
        return;
      }

      const applyButton = document.getElementById('applyButton');
      if (
        currentOpportunity &&
        Number(currentOpportunity.capacity) > 0 &&
        Number(currentOpportunity.accepted_count) >= Number(currentOpportunity.capacity)
      ) {
        showToast('This opportunity is full and no longer accepts applications.', 'error');
        return;
      }

      applyButton.style.pointerEvents = 'none';
      applyButton.textContent = 'Submitting...';

      try {
        const questions = parseQuestions(currentOpportunity?.application_questions);
        const application_answers = questions.map((_, index) => document.getElementById(`answer-${index}`)?.value.trim() || '');
        const response = await fetch('/api/applications', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${localStorage.getItem('token')}`
          },
          body: JSON.stringify({ opportunity_id: opportunityId, application_answers })
        });

        if (!response.ok) {
          const err = await response.json();
          throw new Error(err.error || "Failed");
        }

        showToast('Application submitted successfully.', 'success');
        applyButton.textContent = 'Applied';
      } catch (error) {
        showToast(error.message, 'error');
        applyButton.style.pointerEvents = '';
        applyButton.textContent = 'Apply Now';
      }
    }

    if (oppId) {
      loadFeedback(oppId);
    }
  </script>

</body>
</html>
