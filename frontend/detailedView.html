<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Volunteering Opportunity</title>

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;

      background:
        linear-gradient(rgba(10,25,50,0.85), rgba(10,25,50,0.95)),
        url('handinhand.jpeg') no-repeat center center fixed;

      background-size: cover;

      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      max-width: 800px;
      width: 90%;

      padding: 30px;
      border-radius: 20px;

      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(12px);

      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);

      color: white;
    }

    .logo {
      width: 90px;
      margin-bottom: 10px;
    }

    h1 {
      color: #4dabf7;
      text-align: center;
      margin-bottom: 20px;
    }

    .section {
      margin-bottom: 20px;
    }

    .section h3 {
      color: #4dabf7;
      margin-bottom: 5px;
    }

    .section p {
      color: rgba(255,255,255,0.9);
    }

    strong {
      color: white;
    }

    .apply-button {
      display: block;
      text-align: center;

      background: linear-gradient(135deg, #ff7a18, #0d6efd);
      color: white;

      padding: 12px;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;

      border-radius: 10px;
      margin-top: 20px;
      transition: 0.2s;
    }

    .apply-button:hover {
      transform: scale(1.05);
    }
  </style>
</head>

<body>

  <div class="container">

    <div style="text-align:center;">
      <img src="logo.png" class="logo">
    </div>

    <h1 id="opportunity-title"></h1>

    <div class="section">
      <h3>Description</h3>
      <p id="opportunity-description"></p>
    </div>

    <div class="section">
      <h3>Location</h3>
      <p id="opportunity-location"></p>
    </div>

    <div class="section">
      <h3>Date & Time Commitment</h3>
      <p id="opportunity-date"></p>
      <p id="opportunity-time"></p>
    </div>

    <div class="section">
      <h3>NGO Info</h3>
      <p><strong>Name:</strong> <span id="ngo-name"></span></p>
    </div>

    <a href="#" class="apply-button" onclick="applyForOpportunity(oppId)">
      Apply Now
    </a>

  </div>

  <script>
    let oppId = null;
    const params = new URLSearchParams(window.location.search);
    oppId = params.get('id');

    if (!oppId) {
      alert("No opportunity ID in URL");
    } else {
      fetchOpportunity(oppId);
    }

    function fetchOpportunity(id) {
      fetch(`api/opportunities/${id}`)
        .then(res => {
          if (!res.ok) {
            return res.json().then(j => { throw new Error(j.error || res.statusText) });
          }
          return res.json();
        })
        .then(data => {
          document.getElementById('opportunity-title').textContent = data.title;
          document.getElementById('opportunity-description').textContent = data.description;
          document.getElementById('opportunity-location').textContent = data.location;

          document.getElementById('opportunity-date').textContent =
            `Starts: ${new Date(data.start_date).toLocaleDateString()}`;

          document.getElementById('opportunity-time').textContent =
            `Ends: ${new Date(data.end_date).toLocaleDateString()}`;

          document.getElementById('ngo-name').textContent = data.ngo_name;
        })
        .catch(err => {
          console.error(err);
          alert(`Could not load opportunity: ${err.message}`);
        });
    }

    function checkAuth() {
      return localStorage.getItem("token") != null;
    }

    async function applyForOpportunity(opportunityId) {

      if (!checkAuth()) {
        alert('Please login first');
        window.location.href = 'login.html';
        return;
      }

      try {
        const response = await fetch('https://civicconnect-516m.onrender.com/api/applications', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${localStorage.getItem('token')}`
          },
          body: JSON.stringify({ opportunity_id: opportunityId })
        });

        if (!response.ok) {
          const err = await response.json();
          throw new Error(err.error || "Failed");
        }

        alert('Application submitted successfully!');
      } catch (error) {
        alert(error.message);
      }
    }
  </script>

</body>
</html>
