<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register | CivicConnect</title>
    <script src="notifications.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", sans-serif;

            background:
                linear-gradient(rgba(10,25,50,0.85), rgba(10,25,50,0.95)),
                url('handinhand.jpeg') no-repeat center center fixed;

            background-size: cover;

            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .auth-card {
            max-width: 460px;
            width: 100%;
            padding: 30px;
            border-radius: 20px;

            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(12px);

            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);

            color: white;
        }

        .logo {
            width: 130px;
            display: block;
            margin: 0 auto 15px;
        }

        h3 {
            text-align: center;
            color: white;
        }

        .subtitle {
            text-align: center;
            color: rgba(255,255,255,0.7);
            margin-bottom: 20px;
        }

        .form-label {
            color: rgba(255,255,255,0.85);
        }

        .form-control {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            border-radius: 10px;
            padding: 12px;
        }

        .form-control::placeholder {
            color: rgba(255,255,255,0.5);
        }

        .form-control:focus {
            border-color: #4dabf7;
            box-shadow: 0 0 0 2px rgba(77,171,247,0.3);
            background: rgba(255,255,255,0.1);
        }

        .primary-btn {
            background: linear-gradient(135deg, #ff7a18, #0d6efd);
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-weight: 600;
            color: white;
            width: 100%;
            margin-top: 12px;
            transition: 0.3s;
        }

        .primary-btn:hover {
            transform: scale(1.03);
            opacity: 0.9;
        }

        .secondary-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 12px;
            padding: 14px;
            width: 100%;
            margin-top: 10px;
            color: white;
        }

        .secondary-btn:hover {
            background: rgba(255,255,255,0.2);
        }

        .stage {
            display: none;
        }

        .stage.active {
            display: block;
        }

        .form-control-wrapper {
            position: relative;
        }

        .password-eye {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: white;
        }
    </style>
</head>

<body>

<div class="auth-card">

    <img src="logo.png" class="logo" alt="CivicConnect Logo">

    <h3>Create an Account</h3>
    <p class="subtitle">Join CivicConnect and start making an impact.</p>

    <form id="registrationForm">

        <!-- STAGE 1 -->
        <div id="stage1" class="stage active">
            <label class="form-label">Register As</label>
            <select class="form-control" id="role" required>
                <option value="">Select Role</option>
                <option value="Volunteer">Volunteer</option>
                <option value="NGO">NGO</option>
            </select>

            <button type="button" class="primary-btn" onclick="nextStage(2)">Next</button>
        </div>

        <!-- STAGE 2 -->
        <div id="stage2" class="stage">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control mb-2" id="name" required>

            <label class="form-label">Email</label>
            <input type="email" class="form-control mb-2" id="email" required>

            <label class="form-label">Password</label>
            <div class="form-control-wrapper mb-2">
                <input type="password" class="form-control" id="password" required>
                <span class="password-eye" onclick="togglePasswordVisibility()">👁</span>
            </div>

            <label class="form-label">Confirm Password</label>
            <input type="password" class="form-control" id="confirmPassword" required>

            <button type="button" class="secondary-btn" onclick="prevStage(1)">Back</button>
            <button type="button" class="primary-btn" onclick="nextStage(3)">Next</button>
        </div>

        <!-- STAGE 3 -->
        <div id="stage3" class="stage">

            <div id="volunteerFields">
                <label class="form-label">Date of Birth</label>
                <input type="date" class="form-control mb-2" id="dob">

                <label class="form-label">City</label>
                <input type="text" class="form-control mb-2" id="city">

                <label class="form-label">Phone</label>
                <input type="tel" class="form-control mb-2" id="phone">

                <label class="form-label">Skills</label>
                <textarea class="form-control mb-2" id="skills"></textarea>
            </div>

            <div id="ngoFields">
                <label class="form-label">NGO Name</label>
                <input type="text" class="form-control mb-2" id="ngoName">

                <label class="form-label">NGO Description</label>
                <textarea class="form-control mb-2" id="ngoDescription"></textarea>

                <label class="form-label">NGO Address</label>
                <input type="text" class="form-control mb-2" id="ngoAddress">
            </div>

            <button type="button" class="secondary-btn" onclick="prevStage(2)">Back</button>
            <button type="submit" class="primary-btn">Create Account</button>
        </div>

    </form>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        showStage(1);
    });

    function showStage(stage) {
        document.querySelectorAll('.stage').forEach(s => s.classList.remove('active'));
        document.getElementById(`stage${stage}`).classList.add('active');
        updateRoleFields();
    }

    function nextStage(stage) { showStage(stage); }
    function prevStage(stage) { showStage(stage); }

    function updateRoleFields() {
        const role = document.getElementById('role').value;
        document.getElementById('volunteerFields').style.display = role === 'Volunteer' ? 'block' : 'none';
        document.getElementById('ngoFields').style.display = role === 'NGO' ? 'block' : 'none';
    }

    document.getElementById('role').addEventListener('change', updateRoleFields);

    function togglePasswordVisibility() {
        ['password', 'confirmPassword'].forEach(id => {
            const field = document.getElementById(id);
            field.type = field.type === "password" ? "text" : "password";
        });
    }

    document.getElementById("registrationForm").addEventListener("submit", async function (event) {
        event.preventDefault();

        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const role = document.getElementById('role').value;

        const passwordRegex = /^(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}$/;
        if (!passwordRegex.test(password)) {
            alert("Password must contain 8+ chars, uppercase, lowercase, and number.");
            return;
        }

        if (password !== confirmPassword) {
            alert("Passwords do not match.");
            return;
        }

        const formData = {
            name: document.getElementById('name').value.trim(),
            email: document.getElementById('email').value.trim(),
            password,
            role
        };

        if (role === 'Volunteer') {
            formData.volunteer = {
                dob: document.getElementById('dob').value,
                city: document.getElementById('city').value.trim(),
                phone: document.getElementById('phone').value.trim(),
                skills: document.getElementById('skills').value.trim()
            };
        }

        if (role === 'NGO') {
            formData.ngo = {
                name: document.getElementById('ngoName').value.trim(),
                description: document.getElementById('ngoDescription').value.trim(),
                address: document.getElementById('ngoAddress').value.trim()
            };
        }

        try {
            const response = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            });

            const data = await response.json();
            if (!response.ok) throw new Error(data.error || "Registration failed");

            alert("Registration successful!");
            window.location.href = "login.html";
        } catch (error) {
            alert(error.message);
        }
    });
</script>

</body>
</html>
