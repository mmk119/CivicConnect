<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Password - CivicConnect</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(180deg, #e9fbfb, #9fe7e5);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .reset-card {
            max-width: 560px;
            width: 100%;
            padding: 36px 40px;
            border-radius: 20px;
            background: #ffffff;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.12);
        }

        .logo {
            width: 140px;
            display: block;
            margin: 0 auto 16px;
        }

        h4 {
            text-align: center;
            font-weight: 600;
            margin-bottom: 6px;
            color: #1f1f1f;
        }

        .subtitle {
            text-align: center;
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 26px;
        }

        .form-label {
            font-weight: 500;
            margin-bottom: 6px;
            color: #2b2b2b;
        }

        .form-control {
            padding: 14px 46px 14px 14px;
            border-radius: 12px;
            border: 1px solid #ddd;
            font-size: 15px;
        }

        .form-control:focus {
            border-color: #0fb9b1;
            box-shadow: 0 0 0 2px rgba(15, 185, 177, 0.25);
        }

        .primary-btn {
            margin-top: 8px;
            background: linear-gradient(135deg, #0fb9b1, #3ddbd9);
            color: #fff;
            border: none;
            border-radius: 14px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            transition: all 0.25s ease;
        }

        .primary-btn:hover {
            background: linear-gradient(135deg, #0aa39c, #2ecbc8);
            transform: translateY(-1px);
        }

        .primary-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .text-danger {
            font-size: 13px;
            margin-top: 4px;
        }

        .position-relative {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            top: 50%;
            right: 14px;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 16px;
            color: #555;
            user-select: none;
        }

        .mb-4 {
            margin-bottom: 18px !important;
        }

        .alert {
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 16px;
        }
    </style>
</head>

<body>

    <div class="reset-card">
        <img src="logo.png" alt="CivicConnect Logo" class="logo">

        <h4>Reset Password</h4>
        <p class="subtitle">Choose a strong new password to secure your account.</p>

        <!-- Error/success message area -->
        <div id="alertBox" style="display:none;"></div>

        <form id="resetPasswordForm" novalidate>
            <div class="mb-4 position-relative">
                <label class="form-label">New Password</label>
                <input type="password" class="form-control" id="newPassword" required>
                <span class="toggle-password" onclick="togglePassword('newPassword')">👁</span>
                <div class="text-danger" id="passwordStrengthError"></div>
            </div>

            <div class="mb-4 position-relative">
                <label class="form-label">Confirm New Password</label>
                <input type="password" class="form-control" id="confirmPassword" required>
                <span class="toggle-password" onclick="togglePassword('confirmPassword')">👁</span>
                <div class="text-danger" id="passwordError"></div>
            </div>

            <input type="hidden" id="resetToken">

            <button type="submit" class="primary-btn" id="submitBtn">
                Reset Password
            </button>
        </form>
    </div>

    <script>
        // Read token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            showAlert('danger', 'Invalid or missing reset token. Please request a new password reset link.');
            document.getElementById('submitBtn').disabled = true;
        }

        document.getElementById('resetToken').value = token || '';

        function togglePassword(id) {
            const input = document.getElementById(id);
            input.type = input.type === "password" ? "text" : "password";
        }

        function showAlert(type, message) {
            const alertBox = document.getElementById('alertBox');
            alertBox.style.display = 'block';
            alertBox.className = `alert alert-${type}`;
            alertBox.textContent = message;
        }

        document.getElementById("resetPasswordForm").addEventListener("submit", async function (event) {
            event.preventDefault();

            const newPassword = document.getElementById("newPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const passwordError = document.getElementById("passwordError");
            const passwordStrengthError = document.getElementById("passwordStrengthError");
            const submitBtn = document.getElementById("submitBtn");

            // Clear previous errors
            passwordError.textContent = "";
            passwordStrengthError.textContent = "";
            document.getElementById('alertBox').style.display = 'none';

            // Validate password strength
            const strongPasswordRegex =
                /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;

            if (!strongPasswordRegex.test(newPassword)) {
                passwordStrengthError.textContent =
                    "Password must be at least 8 characters with uppercase, lowercase, number, and symbol.";
                return;
            }

            if (newPassword !== confirmPassword) {
                passwordError.textContent = "Passwords do not match.";
                return;
            }

            // Disable button to prevent double submit
            submitBtn.disabled = true;
            submitBtn.textContent = "Resetting...";

            try {
                const res = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });

                // FIX: always parse JSON and check res.ok before redirecting
                const data = await res.json();

                if (!res.ok) {
                    showAlert('danger', data.error || `Error ${res.status}: Reset failed.`);
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Reset Password";
                    return;
                }

                showAlert('success', data.message || 'Password reset successfully!');
                submitBtn.textContent = "Done!";

                // Redirect after short delay so user can see success message
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);

            } catch (err) {
                console.error('Reset fetch error:', err);
                showAlert('danger', 'Network error — make sure the server is running and try again.');
                submitBtn.disabled = false;
                submitBtn.textContent = "Reset Password";
            }
        });
    </script>

</body>
</html>
