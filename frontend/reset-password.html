<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | CivicConnect</title>
    <script src="notifications.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;

            background:
                linear-gradient(rgba(10,25,50,0.85), rgba(10,25,50,0.95)),
                url('handinhand.jpeg') no-repeat center center fixed;

            background-size: cover;

            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .reset-card {
            width: 100%;
            max-width: 500px;
            padding: 30px;
            border-radius: 20px;

            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(12px);

            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);

            color: white;
        }

        .logo {
            width: 120px;
            display: block;
            margin: 0 auto 15px;
        }

        h4 {
            text-align: center;
            color: white;
        }

        .subtitle {
            text-align: center;
            color: rgba(255,255,255,0.7);
            margin-bottom: 20px;
        }

        .form-label {
            color: rgba(255,255,255,0.85);
        }

        .form-control {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            border-radius: 10px;
            padding: 12px;
        }

        .form-control::placeholder {
            color: rgba(255,255,255,0.5);
        }

        .form-control:focus {
            border-color: #4dabf7;
            box-shadow: 0 0 0 2px rgba(77,171,247,0.3);
            background: rgba(255,255,255,0.1);
        }

        .primary-btn {
            background: linear-gradient(135deg, #ff7a18, #0d6efd);
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-weight: 600;
            color: white;
            width: 100%;
            margin-top: 10px;
            transition: 0.3s;
        }

        .primary-btn:hover {
            transform: scale(1.03);
            opacity: 0.9;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: white;
        }

        .position-relative {
            position: relative;
        }

        .alert {
            border-radius: 12px;
        }
    </style>
</head>

<body>

<div class="reset-card">

    <img src="logo.png" class="logo">

    <h4>Reset Password</h4>
    <p class="subtitle">Choose a strong new password to secure your account.</p>

    <div id="alertBox" style="display:none;"></div>

    <form id="resetPasswordForm">

        <div class="mb-3 position-relative">
            <label class="form-label">New Password</label>
            <input type="password" class="form-control" id="newPassword" required>
            <span class="toggle-password" onclick="togglePassword('newPassword')">👁</span>
            <div class="text-danger" id="passwordStrengthError"></div>
        </div>

        <div class="mb-3 position-relative">
            <label class="form-label">Confirm Password</label>
            <input type="password" class="form-control" id="confirmPassword" required>
            <span class="toggle-password" onclick="togglePassword('confirmPassword')">👁</span>
            <div class="text-danger" id="passwordError"></div>
        </div>

        <input type="hidden" id="resetToken">

        <button type="submit" class="primary-btn" id="submitBtn">
            Reset Password
        </button>
    </form>

</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const token = urlParams.get('token');

if (!token) {
    showAlert('danger', 'Invalid or missing reset token.');
    document.getElementById('submitBtn').disabled = true;
}

document.getElementById('resetToken').value = token || '';

function togglePassword(id) {
    const input = document.getElementById(id);
    input.type = input.type === "password" ? "text" : "password";
}

function showAlert(type, message) {
    const alertBox = document.getElementById('alertBox');
    alertBox.style.display = 'block';
    alertBox.className = `alert alert-${type}`;
    alertBox.textContent = message;
}

document.getElementById("resetPasswordForm").addEventListener("submit", async function (e) {
    e.preventDefault();

    const newPassword = document.getElementById("newPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (newPassword !== confirmPassword) {
        showAlert('danger', 'Passwords do not match.');
        return;
    }

    try {
        const res = await fetch('/api/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, newPassword })
        });

        const data = await res.json();

        if (!res.ok) {
            showAlert('danger', data.error);
            return;
        }

        showAlert('success', 'Password reset successful!');
        setTimeout(() => window.location.href = 'login.html', 1500);

    } catch (err) {
        showAlert('danger', 'Server error.');
    }
});
</script>

</body>
</html>
